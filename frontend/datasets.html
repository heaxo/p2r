<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pic2Remnant - 数据集管理</title>
  <link rel="stylesheet" href="/ui/vendor/bootstrap/bootstrap.min.css" />
  <style>
    :root {
      --app-bg: #eef2f7;
      --app-panel: #ffffff;
      --app-border: #d7deea;
      --app-muted: #667085;
      --app-text: #1f2937;
      --app-blue: #2D579B;
      --app-blue-dark: #23467d;
      --app-blue-soft: #eef4fb;
      --app-sidebar: #f8fafc;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--app-text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .desktop-frame {
      width: calc(100% - 16px);
      height: 100vh;
      margin: 0 auto;
      padding: 8px 0;
      display: grid;
      grid-template-rows: 1fr;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      background: #fff;
      border: 1px solid var(--app-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .sidebar {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--app-sidebar);
      border-right: 1px solid var(--app-border);
    }

    .sidebar-head,
    .sidebar-foot,
    .content-head {
      background: #fff;
      border-bottom: 1px solid var(--app-border);
      padding: 10px;
    }

    .sidebar-foot {
      border-top: 1px solid var(--app-border);
      border-bottom: 0;
    }

    .dataset-list {
      min-height: 0;
      overflow: auto;
      padding: 8px;
      scrollbar-width: thin;
      scrollbar-color: #9aa9bd #eef2f7;
    }

    .dataset-row {
      width: 100%;
      display: grid;
      gap: 5px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 9px 10px;
    }

    .dataset-row:hover {
      background: #fff;
      border-color: var(--app-border);
    }

    .dataset-row.active {
      background: var(--app-blue-soft);
      border-color: rgba(45, 87, 155, .42);
    }

    .dataset-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .content {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .content-head {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
    }

    .content-body {
      min-height: 0;
      padding: 10px;
      overflow: hidden;
    }

    .table-card {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #fff;
      border: 1px solid var(--app-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .table-card-head {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--app-border);
      padding: 8px 10px;
      background: #fff;
    }

    .item-filter {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--app-border);
      border-radius: 7px;
      background: #f8fafc;
      padding: 3px;
    }

    .item-filter button {
      min-height: 28px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #344054;
      font-size: 12px;
      padding: 0 9px;
      white-space: nowrap;
    }

    .item-filter button.active {
      background: #fff;
      color: var(--app-blue);
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .12);
    }

    .table-wrap {
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #9aa9bd #eef2f7;
    }

    .table-wrap::-webkit-scrollbar,
    .dataset-list::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .table-wrap::-webkit-scrollbar-track,
    .dataset-list::-webkit-scrollbar-track {
      background: #eef2f7;
      border-radius: 999px;
    }

    .table-wrap::-webkit-scrollbar-thumb,
    .dataset-list::-webkit-scrollbar-thumb {
      background: #9aa9bd;
      border: 2px solid #eef2f7;
      border-radius: 999px;
    }

    .table-wrap::-webkit-scrollbar-thumb:hover,
    .dataset-list::-webkit-scrollbar-thumb:hover {
      background: #718096;
    }

    .data-table {
      min-width: 2820px;
      margin-bottom: 0;
      table-layout: fixed;
    }

    .data-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fafc;
      color: #344054;
      border-bottom-color: var(--app-border);
      white-space: nowrap;
      user-select: none;
    }

    .data-table th.resizable {
      position: sticky;
    }

    .column-resizer {
      position: absolute;
      top: 0;
      right: -3px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 6;
      touch-action: none;
    }

    .column-resizer:hover,
    .column-resizer.active {
      background: rgba(45, 87, 155, .18);
    }

    .data-table td {
      vertical-align: top;
      border-color: var(--app-border);
      line-height: 1.25;
      padding: 6px 8px;
    }

    .data-table .image-col {
      width: 96px;
    }

    .data-table .plate-col {
      width: 210px;
    }

    .data-table .dimension-col {
      width: 880px;
    }

    .data-table .recognition-col {
      width: 560px;
    }

    .data-table .status-col {
      width: 170px;
    }

    .data-table .dxf-col {
      width: 420px;
    }

    .data-table .result-col {
      width: 110px;
    }

    .data-table .actions-col,
    .data-table .actions-cell {
      width: 300px;
      position: sticky;
      right: 0;
      z-index: 3;
      background: #fff;
      box-shadow: -8px 0 12px -12px rgba(15, 23, 42, .45);
    }

    .data-table .actions-col {
      z-index: 5;
      background: #f8fafc;
    }

    .plate-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 6px;
    }

    .item-actions .btn,
    .result-links .btn,
    .dxf-actions .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .item-actions .btn {
      min-height: 28px;
      padding: 3px 8px;
      font-size: 12px;
      line-height: 1.2;
    }

    .item-actions .icon-svg,
    .result-links .icon-svg,
    .dxf-actions .icon-svg {
      flex: 0 0 auto;
      margin-right: 0;
    }

    .dimension-grid,
    .params-grid {
      display: grid;
      column-gap: 18px;
      row-gap: 2px;
      align-items: start;
    }

    .dimension-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .params-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .attribute-stack {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .attribute-line {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: break-all;
      font-size: 12px;
      line-height: 1.35;
    }

    .attribute-label {
      display: inline-block;
      width: 58px;
      color: var(--app-muted);
      text-align-last: justify;
    }

    .attribute-label.large {
      width: 72px;
    }

    .attribute-value {
      color: var(--app-text);
      font-weight: 500;
    }

    .small-muted {
      color: var(--app-muted);
      font-size: 12px;
    }

    .status-badge {
      border: 1px solid transparent;
      font-weight: 700;
    }

    .status-unrecognized,
    .status-pending,
    .status-queued {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #475569;
    }

    .status-recognizing,
    .status-processing {
      background: #fffbeb;
      border-color: #fde68a;
      color: #b45309;
    }

    .status-recognized,
    .status-completed {
      background: #ecfdf3;
      border-color: #bbf7d0;
      color: #15803d;
    }

    .status-failed {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }

    .item-progress {
      display: grid;
      gap: 3px;
      margin-top: 6px;
    }

    .item-progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .item-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--app-blue);
      transition: width .24s ease;
    }

    .item-progress.is-active .item-progress-fill {
      background-image: linear-gradient(
        45deg,
        rgba(255, 255, 255, .35) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, .35) 50%,
        rgba(255, 255, 255, .35) 75%,
        transparent 75%,
        transparent
      );
      background-size: 18px 18px;
      animation: progress-stripes .7s linear infinite;
    }

    @keyframes progress-stripes {
      to {
        background-position: 18px 0;
      }
    }

    .preview-image {
      width: 78px;
      height: 56px;
      object-fit: cover;
      border: 1px solid var(--app-border);
      border-radius: 6px;
      background: #f8fafc;
    }

    .image-pick-button {
      border: 0;
      padding: 0;
      background: transparent;
      cursor: crosshair;
    }

    .point-picker-help {
      color: var(--app-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .point-picker-stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      border: 1px solid var(--app-border);
      border-radius: 6px;
      overflow: hidden;
      background: #111827;
      cursor: crosshair;
    }

    .point-picker-stage img {
      display: block;
      max-width: min(100%, 1080px);
      max-height: 68vh;
      width: auto;
      height: auto;
      user-select: none;
    }

    .point-marker {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(15, 23, 42, .55);
      pointer-events: none;
    }

    .point-marker.plate {
      background: #2563eb;
    }

    .point-marker.paper {
      background: #d946ef;
    }

    .modal-image-preview {
      width: 78px;
      height: 56px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--app-border);
      border-radius: 6px;
      background: #f8fafc;
      margin-top: 8px;
    }

    .dxf-preview-image {
      width: 78px;
      height: 56px;
      object-fit: contain;
      display: block;
      border: 1px solid var(--app-border);
      border-radius: 6px;
      background: #f8fafc;
    }

    .dxf-preview-placeholder {
      width: 78px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--app-border);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--app-muted);
      font-size: 12px;
      text-align: center;
    }

    .empty-state {
      height: 100%;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--app-muted);
      text-align: center;
      padding: 24px;
    }

    .message-line {
      min-height: 20px;
      font-size: 13px;
    }

    .btn {
      border-radius: 6px;
    }

    .btn .icon-svg,
    .link-with-icon .icon-svg {
      width: 14px;
      height: 14px;
      margin-right: 5px;
      vertical-align: -2px;
      stroke-width: 2.2;
      flex-shrink: 0;
    }

    .btn-icon .icon-svg {
      margin-right: 0;
    }

    .dimension-lines {
      display: grid;
      gap: 2px;
    }

    .btn-primary {
      background-color: var(--app-blue);
      border-color: var(--app-blue);
    }

    .btn-primary:hover,
    .btn-primary:focus {
      background-color: var(--app-blue-dark);
      border-color: var(--app-blue-dark);
    }

    .btn-outline-primary {
      color: var(--app-blue);
      border-color: var(--app-blue);
    }

    .btn-outline-primary:hover,
    .btn-outline-primary:focus {
      color: #fff;
      background-color: var(--app-blue);
      border-color: var(--app-blue);
    }

    .btn-icon {
      min-width: 34px;
      padding-left: 8px;
      padding-right: 8px;
    }

    .btn-loading-spinner {
      width: 13px;
      height: 13px;
      display: inline-block;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .modal {
      background: rgba(15, 23, 42, .34);
    }

    .modal.show {
      display: block;
    }

    .modal-dialog {
      margin-top: 7vh;
    }

    .form-label {
      color: #344054;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .dxf-cell {
      min-width: 0;
    }

    .dxf-result {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    .dxf-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .dxf-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: stretch;
    }

    .dxf-actions .btn {
      min-height: 24px;
      padding: 2px 8px;
      line-height: 1.2;
      font-size: 12px;
      white-space: nowrap;
    }

    .expert-progress {
      max-width: 520px;
      margin-top: 6px;
    }

    .expert-progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .expert-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--app-blue);
      transition: width .24s ease;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .desktop-frame,
      .workspace,
      .sidebar,
      .content,
      .table-card {
        height: auto;
        display: block;
      }

      .desktop-frame {
        width: calc(100% - 16px);
        padding: 10px 0 18px;
      }

      .workspace {
        min-height: auto;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--app-border);
      }

      .dataset-list {
        max-height: 280px;
      }

      .content-body {
        overflow: visible;
      }
    }
  </style>
</head>
<body>
  <div class="desktop-frame">
    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
            <strong>数据集</strong>
            <button id="refreshBtn" class="btn btn-outline-secondary btn-sm btn-icon" type="button" title="刷新"></button>
          </div>
          <div class="d-grid gap-2">
            <button id="openCreateDatasetBtn" class="btn btn-primary btn-sm" type="button">新建数据集</button>
            <div class="btn-group btn-group-sm" role="group" aria-label="Excel 操作">
              <button id="uploadExcelBtn" class="btn btn-outline-primary" type="button">上传 Excel</button>
              <button id="downloadTemplateBtn" class="btn btn-outline-secondary" type="button">下载模板</button>
            </div>
            <input id="excelFile" type="file" accept=".xlsx,.xlsm" hidden />
          </div>
        </div>
        <div id="datasetList" class="dataset-list"></div>
        <div class="sidebar-foot">
          <div id="listMessage" class="message-line text-secondary"></div>
        </div>
      </aside>

      <section class="content">
        <div class="content-head">
          <div class="min-w-0">
            <div id="selectedTitle" class="h6 mb-1">未选择数据集</div>
            <div id="selectedMeta" class="small-muted"></div>
            <div id="detailMessage" class="message-line text-secondary"></div>
            <div id="expertImportProgress" class="expert-progress" hidden>
              <div class="expert-progress-track">
                <div id="expertImportProgressFill" class="expert-progress-fill"></div>
              </div>
              <div id="expertImportProgressText" class="small-muted mt-1"></div>
            </div>
          </div>
          <div class="d-flex flex-wrap justify-content-end gap-2">
            <button id="openItemBtn" class="btn btn-primary btn-sm" type="button" disabled>新增数据</button>
            <button id="recognizeDatasetBtn" class="btn btn-outline-primary btn-sm" type="button" disabled>开始识别</button>
            <button id="clearDatasetRecognitionBtn" class="btn btn-outline-secondary btn-sm" type="button" disabled>清除识别状态</button>
            <button id="importSettingsBtn" class="btn btn-outline-secondary btn-sm" type="button" disabled>导入设置</button>
            <button id="importExpertBtn" class="btn btn-outline-primary btn-sm" type="button" disabled>导入至Expert</button>
            <button id="copyDatasetBtn" class="btn btn-outline-secondary btn-sm" type="button" disabled>复制</button>
            <button id="downloadDxfBtn" class="btn btn-outline-secondary btn-sm" type="button" disabled>下载 DXF</button>
            <button id="deleteDatasetBtn" class="btn btn-outline-danger btn-sm" type="button" disabled>删除</button>
          </div>
        </div>

        <div class="content-body">
          <div class="table-card">
            <div class="table-card-head">
              <div class="d-flex align-items-center gap-3">
                <strong>数据列表</strong>
                <div id="itemFilter" class="item-filter" aria-label="数据状态筛选">
                  <button type="button" data-filter="pending">未开始</button>
                  <button type="button" data-filter="completed">已完成识别</button>
                  <button type="button" data-filter="failed">识别失败</button>
                  <button type="button" data-filter="active">正在识别</button>
                  <button type="button" data-filter="all">全部</button>
                </div>
              </div>
              <span id="itemCount" class="small-muted"></span>
            </div>
            <div id="emptyItems" class="empty-state">请选择左侧数据集，或新建数据集后录入数据。</div>
            <div id="itemsTableWrap" class="table-wrap" hidden>
              <table id="dataTable" class="table table-hover table-sm data-table">
                <colgroup>
                  <col data-col="image" class="image-col" />
                  <col data-col="plate" class="plate-col" />
                  <col data-col="status" class="status-col" />
                  <col data-col="dxf" class="dxf-col" />
                  <col data-col="dimension" class="dimension-col" />
                  <col data-col="recognition" class="recognition-col" />
                  <col data-col="result" class="result-col" />
                  <col data-col="actions" class="actions-col" />
                </colgroup>
                <thead>
                  <tr>
                    <th class="image-col" data-col="image">图片</th>
                    <th class="plate-col" data-col="plate">板材信息</th>
                    <th class="status-col" data-col="status">状态</th>
                    <th class="dxf-col" data-col="dxf">DXF</th>
                    <th class="dimension-col" data-col="dimension">尺寸设置</th>
                    <th class="recognition-col" data-col="recognition">识别参数</th>
                    <th class="result-col" data-col="result">其他结果</th>
                    <th class="actions-col" data-col="actions">操作</th>
                  </tr>
                </thead>
                <tbody id="itemsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="datasetModal" class="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createDatasetForm">
          <div class="modal-header">
            <h2 class="modal-title fs-6">新建数据集</h2>
            <button type="button" class="btn-close" data-close-modal="datasetModal" aria-label="关闭"></button>
          </div>
          <div class="modal-body">
            <label for="datasetName" class="form-label">数据集名称</label>
            <input id="datasetName" name="name" class="form-control" type="text" placeholder="留空自动使用年月日时分秒" />
            <div id="datasetNameError" class="invalid-feedback d-block"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-close-modal="datasetModal">取消</button>
            <button class="btn btn-primary" type="submit">创建</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="importSettingsModal" class="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="importSettingsForm">
          <div class="modal-header">
            <h2 class="modal-title fs-6">导入设置</h2>
            <button type="button" class="btn-close" data-close-modal="importSettingsModal" aria-label="关闭"></button>
          </div>
          <div class="modal-body">
            <label for="expertImporter" class="form-label">导入器</label>
            <select id="expertImporter" class="form-select">
              <option value="Procesos">Procesos</option>
              <option value="Masterlink">Masterlink</option>
            </select>
            <div id="importSettingsMessage" class="message-line text-secondary mt-3"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-close-modal="importSettingsModal">取消</button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>

  <script>
    const AUTH_TOKEN = 'tk_c2VjcmV0LXJhbmRvbS10b2tlbi0xMjM0NTY3OA';
    const DATASET_SAM_MODEL = 'sam2';
    const state = {
      datasets: [],
      selectedId: null,
      selected: null,
      editingItem: null,
      pollTimer: null,
      pollInFlight: false,
      itemPreviewUrl: null,
      importTimer: null,
      importStartedAt: 0,
      importDurationMs: 0,
      importInProgress: false,
      itemRenderKeys: new Map(),
      itemFilter: 'pending',
      pointPickingItem: null,
      pointPickingMode: 'plate',
      pointDraft: { plate: '', paper: '' },
    };

    const els = {
      datasetList: document.getElementById('datasetList'),
      listMessage: document.getElementById('listMessage'),
      detailMessage: document.getElementById('detailMessage'),
      expertImportProgress: document.getElementById('expertImportProgress'),
      expertImportProgressFill: document.getElementById('expertImportProgressFill'),
      expertImportProgressText: document.getElementById('expertImportProgressText'),
      selectedTitle: document.getElementById('selectedTitle'),
      selectedMeta: document.getElementById('selectedMeta'),
      createDatasetForm: document.getElementById('createDatasetForm'),
      datasetName: document.getElementById('datasetName'),
      datasetNameError: document.getElementById('datasetNameError'),
      excelFile: document.getElementById('excelFile'),
      refreshBtn: document.getElementById('refreshBtn'),
      openCreateDatasetBtn: document.getElementById('openCreateDatasetBtn'),
      uploadExcelBtn: document.getElementById('uploadExcelBtn'),
      downloadTemplateBtn: document.getElementById('downloadTemplateBtn'),
      importSettingsBtn: document.getElementById('importSettingsBtn'),
      importExpertBtn: document.getElementById('importExpertBtn'),
      importSettingsForm: document.getElementById('importSettingsForm'),
      expertImporter: document.getElementById('expertImporter'),
      importSettingsMessage: document.getElementById('importSettingsMessage'),
      copyDatasetBtn: document.getElementById('copyDatasetBtn'),
      deleteDatasetBtn: document.getElementById('deleteDatasetBtn'),
      recognizeDatasetBtn: document.getElementById('recognizeDatasetBtn'),
      clearDatasetRecognitionBtn: document.getElementById('clearDatasetRecognitionBtn'),
      downloadDxfBtn: document.getElementById('downloadDxfBtn'),
      openItemBtn: document.getElementById('openItemBtn'),
      itemForm: document.getElementById('itemForm'),
      itemModalTitle: document.getElementById('itemModalTitle'),
      itemFormMessage: document.getElementById('itemFormMessage'),
      saveItemBtn: document.getElementById('saveItemBtn'),
      itemImage: document.getElementById('itemImage'),
      itemImagePreview: document.getElementById('itemImagePreview'),
      imageHelp: document.getElementById('imageHelp'),
      plateNo: document.getElementById('plateNo'),
      quantity: document.getElementById('quantity'),
      material: document.getElementById('material'),
      thickness: document.getElementById('thickness'),
      size1: document.getElementById('size1'),
      size2: document.getElementById('size2'),
      targetX: document.getElementById('targetX'),
      targetY: document.getElementById('targetY'),
      paperSource: document.getElementById('paperSource'),
      a4Orientation: document.getElementById('a4Orientation'),
      usePlatePerspective: document.getElementById('usePlatePerspective'),
      platePointRatio: document.getElementById('platePointRatio'),
      paperPointRatio: document.getElementById('paperPointRatio'),
      notchEnabled: document.getElementById('notchEnabled'),
      notchWidth: document.getElementById('notchWidth'),
      notchDepth: document.getElementById('notchDepth'),
      pointPickerModal: document.getElementById('pointPickerModal'),
      pointPickerStage: document.getElementById('pointPickerStage'),
      pointPickerImage: document.getElementById('pointPickerImage'),
      platePointMarker: document.getElementById('platePointMarker'),
      paperPointMarker: document.getElementById('paperPointMarker'),
      pickPlatePointBtn: document.getElementById('pickPlatePointBtn'),
      pickPaperPointBtn: document.getElementById('pickPaperPointBtn'),
      clearPlatePointBtn: document.getElementById('clearPlatePointBtn'),
      clearPaperPointBtn: document.getElementById('clearPaperPointBtn'),
      savePointPickerBtn: document.getElementById('savePointPickerBtn'),
      pointPickerMessage: document.getElementById('pointPickerMessage'),
      emptyItems: document.getElementById('emptyItems'),
      itemsTableWrap: document.getElementById('itemsTableWrap'),
      dataTable: document.getElementById('dataTable'),
      itemFilter: document.getElementById('itemFilter'),
      itemsBody: document.getElementById('itemsBody'),
      itemCount: document.getElementById('itemCount'),
    };

    const statusText = {
      unrecognized: '未识别',
      recognizing: '识别中',
      recognized: '已识别',
      failed: '失败',
      pending: '未识别',
      queued: '排队中',
      processing: '识别中',
      completed: '完成',
    };

    function setMessage(element, text, type = '') {
      element.textContent = text || '';
      element.className = `message-line ${type ? `text-${type}` : 'text-secondary'}`;
    }

    function showError(element, error) {
      const detail = error && error.detail ? error.detail : error;
      const text = Array.isArray(detail) ? detail.map(item => item.msg || JSON.stringify(item)).join('；') : String(detail || '操作失败');
      setMessage(element, text, 'danger');
    }

    function showModal(id) {
      const modal = document.getElementById(id);
      modal.classList.add('show');
      modal.removeAttribute('aria-hidden');
      document.body.classList.add('modal-open');
    }

    function hideModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      if (id === 'itemModal') {
        clearItemPreviewUrl();
      }
    }

    function clearItemPreviewUrl() {
      if (state.itemPreviewUrl) {
        URL.revokeObjectURL(state.itemPreviewUrl);
        state.itemPreviewUrl = null;
      }
    }

    function setItemImagePreview(url) {
      clearItemPreviewUrl();
      if (url) {
        els.itemImagePreview.src = url;
        els.itemImagePreview.hidden = false;
      } else {
        els.itemImagePreview.removeAttribute('src');
        els.itemImagePreview.hidden = true;
      }
    }

    function updateItemImagePreview() {
      const file = els.itemImage.files[0];
      if (file) {
        clearItemPreviewUrl();
        state.itemPreviewUrl = URL.createObjectURL(file);
        els.itemImagePreview.src = state.itemPreviewUrl;
        els.itemImagePreview.hidden = false;
        return;
      }
      setItemImagePreview(state.editingItem && state.editingItem.urls ? state.editingItem.urls.image : '');
    }

    function statusBadge(status) {
      const clean = escapeHtml(status || 'pending');
      const text = statusText[status] || status || '-';
      return `<span class="badge rounded-pill status-badge status-${clean}">${escapeHtml(text)}</span>`;
    }

    function paperSourceLabel(value) {
      return value === 'sam2' ? '标准识别' : '训练集识别';
    }

    function a4OrientationLabel(value) {
      if (value === 'landscape') return 'x297';
      if (value === 'portrait') return 'x210';
      return '自动判断';
    }

    function pointRatioLabel(value) {
      if (!value) return '未指定';
      const parts = String(value).split(',').map(part => Number(part));
      if (parts.length !== 2 || parts.some(part => !Number.isFinite(part))) return value;
      return `${Math.round(parts[0] * 1000) / 10}%, ${Math.round(parts[1] * 1000) / 10}%`;
    }

    async function request(path, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set('X-Auth-Token', AUTH_TOKEN);
      const response = await fetch(path, { ...options, headers });
      const contentType = response.headers.get('content-type') || '';
      if (!response.ok) {
        let detail = response.statusText;
        if (contentType.includes('application/json')) {
          const payload = await response.json();
          detail = payload.detail || payload;
        } else {
          detail = await response.text();
        }
        throw { status: response.status, detail };
      }
      if (contentType.includes('application/json')) {
        return response.json();
      }
      return response;
    }

    async function downloadFile(path, fallbackName) {
      const response = await request(path);
      const blob = await response.blob();
      const disposition = response.headers.get('content-disposition') || '';
      const match = disposition.match(/filename\*=UTF-8''([^;]+)|filename="?([^"]+)"?/i);
      const filename = match ? decodeURIComponent(match[1] || match[2]) : fallbackName;
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function loadDatasets(selectId = state.selectedId) {
      setMessage(els.listMessage, '正在加载...');
      try {
        const payload = await request('/datasets');
        state.datasets = payload.datasets || [];
        renderDatasetList();
        setMessage(els.listMessage, state.datasets.length ? '' : '暂无数据集');

        if (selectId && state.datasets.some(item => item.id === selectId)) {
          await selectDataset(selectId);
        } else if (state.datasets[0]) {
          await selectDataset(state.datasets[0].id);
        } else {
          clearSelection();
        }
      } catch (error) {
        showError(els.listMessage, error);
      }
    }

    function renderDatasetList() {
      els.datasetList.innerHTML = '';
      for (const dataset of state.datasets) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `dataset-row ${dataset.id === state.selectedId ? 'active' : ''}`;
        button.innerHTML = `
          <div class="d-flex align-items-center justify-content-between gap-2">
            <div class="dataset-name">${escapeHtml(dataset.name)}</div>
            ${statusBadge(dataset.status)}
          </div>
          <div class="small-muted">${dataset.item_count || 0} 条 · 完成 ${dataset.completed_count || 0} · ${formatDate(dataset.created_at)}</div>
        `;
        button.addEventListener('click', () => selectDataset(dataset.id));
        els.datasetList.appendChild(button);
      }
    }

    async function selectDataset(datasetId) {
      state.selectedId = datasetId;
      renderDatasetList();
      setMessage(els.detailMessage, '正在加载数据集...');
      try {
        const payload = await request(`/datasets/${datasetId}`);
        state.selected = payload.dataset;
        setMessage(els.detailMessage, '');
        renderSelectedDataset();
        startOrStopPolling();
      } catch (error) {
        showError(els.detailMessage, error);
      }
    }

    function clearSelection() {
      state.selectedId = null;
      state.selected = null;
      state.editingItem = null;
      setMessage(els.detailMessage, '');
      renderSelectedDataset();
    }

    function renderSelectedDataset() {
      const dataset = state.selected;
      const items = dataset ? dataset.items || [] : [];
      const hasRecognizedItems = items.some(item => item.status === 'completed');
      const hasUnrecognizedItems = items.some(item => item.status !== 'completed');
      els.openItemBtn.disabled = !dataset || state.importInProgress;
      els.importSettingsBtn.disabled = !dataset || state.importInProgress;
      els.importExpertBtn.disabled = !dataset || state.importInProgress;
      els.copyDatasetBtn.disabled = !dataset || state.importInProgress;
      els.deleteDatasetBtn.disabled = !dataset || dataset.status === 'recognizing' || state.importInProgress;
      els.recognizeDatasetBtn.disabled = !dataset || dataset.status === 'recognizing' || !items.length || !hasUnrecognizedItems || state.importInProgress;
      els.clearDatasetRecognitionBtn.disabled = !dataset || dataset.status === 'recognizing' || !hasRecognizedItems || state.importInProgress;
      els.downloadDxfBtn.disabled = !dataset || !items.some(item => item.urls && item.urls.dxf) || state.importInProgress;

      if (!dataset) {
        els.selectedTitle.textContent = '未选择数据集';
        els.selectedMeta.textContent = '';
        els.itemCount.textContent = '';
        els.emptyItems.hidden = false;
        els.itemsTableWrap.hidden = true;
        els.itemsBody.innerHTML = '';
        state.itemRenderKeys.clear();
        hideExpertProgress();
        return;
      }

      els.selectedTitle.innerHTML = `<span class="me-2">${escapeHtml(dataset.name)}</span>${statusBadge(dataset.status)}`;
      els.selectedMeta.textContent = `${dataset.item_count || 0} 条数据，完成 ${dataset.completed_count || 0}，未识别 ${items.filter(item => item.status !== 'completed').length}，失败 ${dataset.failed_count || 0}，导入器 ${dataset.expert_importer || 'Procesos'}，创建于 ${formatDate(dataset.created_at)}`;
      renderItemFilter(items);
      const visibleItems = filterItems(items);
      els.itemCount.textContent = `${visibleItems.length} / ${items.length} 条`;
      renderItems(visibleItems);
    }

    function itemFilterKey(item) {
      if (!item || item.status === 'pending' || item.status === 'unrecognized') return 'pending';
      if (item.status === 'completed' || item.status === 'recognized') return 'completed';
      if (item.status === 'failed') return 'failed';
      if (item.status === 'queued' || item.status === 'processing' || item.status === 'recognizing') return 'active';
      return 'pending';
    }

    function filterItems(items) {
      if (state.itemFilter === 'all') return items;
      return items.filter(item => itemFilterKey(item) === state.itemFilter);
    }

    function renderItemFilter(items) {
      const counts = { pending: 0, completed: 0, failed: 0, active: 0, all: items.length };
      for (const item of items) {
        const key = itemFilterKey(item);
        counts[key] = (counts[key] || 0) + 1;
      }
      els.itemFilter.querySelectorAll('button[data-filter]').forEach(button => {
        const key = button.dataset.filter;
        const label = button.textContent.replace(/\s*\(.*\)$/, '');
        button.textContent = `${label} (${counts[key] || 0})`;
        button.classList.toggle('active', key === state.itemFilter);
      });
    }

    function renderItems(items) {
      els.emptyItems.hidden = items.length > 0;
      els.itemsTableWrap.hidden = items.length === 0;
      const existingRows = new Map();
      els.itemsBody.querySelectorAll('tr[data-item-id]').forEach(row => {
        existingRows.set(row.dataset.itemId, row);
      });
      const nextIds = new Set();

      for (const item of items) {
        const itemId = String(item.id);
        nextIds.add(itemId);
        let tr = existingRows.get(itemId);
        if (!tr) {
          tr = document.createElement('tr');
          tr.dataset.itemId = itemId;
        }
        const renderKey = itemRenderKey(item);
        if (state.itemRenderKeys.get(itemId) !== renderKey) {
          tr.innerHTML = buildItemRowHtml(item);
          state.itemRenderKeys.set(itemId, renderKey);
        }
        els.itemsBody.appendChild(tr);
      }

      for (const [itemId, row] of existingRows) {
        if (!nextIds.has(itemId)) {
          row.remove();
          state.itemRenderKeys.delete(itemId);
        }
      }
    }

    function itemRenderKey(item) {
      return JSON.stringify({
        id: item.id,
        image: item.urls && item.urls.image,
        status: item.status,
        progress: item.progress || 0,
        message: item.message || '',
        dxf: item.urls && item.urls.dxf,
        dxfPreview: item.urls && item.urls.dxf_preview,
        plateNo: item.plate_no || '',
        filename: item.original_filename || '',
        quantity: item.quantity ?? '',
        material: item.material || '',
        thickness: item.thickness_mm ?? '',
        size1: item.dxf_target_size_1_mm ?? '',
        size2: item.dxf_target_size_2_mm ?? '',
        targetX: item.dxf_target_x_mm ?? '',
        targetY: item.dxf_target_y_mm ?? '',
        paperSource: item.paper_source || '',
        a4Orientation: item.a4_orientation || '',
        platePoint: item.plate_point_ratio || '',
        paperPoint: item.paper_point_ratio || '',
        usePlatePerspective: !!item.use_plate_perspective,
        notchEnabled: !!item.dxf_notch_fill_enabled,
        notchWidth: item.dxf_notch_fill_max_width_mm ?? '',
        notchDepth: item.dxf_notch_fill_max_depth_mm ?? '',
      });
    }

    function buildItemRowHtml(item) {
      const imageHtml = item.urls && item.urls.image
        ? `<button class="image-pick-button" type="button" data-action="pick-points" data-id="${item.id}" title="指定钢板/A4纸坐标"><img class="preview-image" src="${item.urls.image}" alt="" loading="lazy" decoding="async"></button>`
        : `<div class="small-muted">${escapeHtml(item.original_filename || '')}</div>`;
      return `
        <td class="image-col">${imageHtml}</td>
        <td class="plate-col">
          <div class="fw-semibold plate-title" title="${escapeHtml(item.plate_no || item.original_filename || item.id)}">${escapeHtml(item.plate_no || item.original_filename || item.id)}</div>
          <div class="small-muted">数量：${formatNumber(item.quantity)} · ${escapeHtml(item.material || '-')}${item.thickness_mm ? ` · ${item.thickness_mm} mm` : ''}</div>
        </td>
        <td class="status-col">
          ${statusBadge(item.status)}
          ${itemProgress(item)}
        </td>
        <td class="dxf-col dxf-cell">${buildDxfCell(item)}</td>
        <td class="dimension-col">
          ${buildDimensionsCell(item)}
        </td>
        <td class="recognition-col">
          ${buildRecognitionParamsCell(item)}
        </td>
        <td class="result-col">${buildOtherResultLinks(item)}</td>
        <td class="actions-col actions-cell">
          <div class="item-actions">
            <button class="btn btn-outline-secondary" type="button" data-action="edit" data-id="${item.id}">${iconSvg('edit')}编辑</button>
            ${item.status === 'completed' ? `<button class="btn btn-outline-secondary" type="button" data-action="clear-recognition" data-id="${item.id}">${iconSvg('rotate')}清除状态</button>` : ''}
            <button class="btn btn-outline-danger" type="button" data-action="delete" data-id="${item.id}">${iconSvg('trash')}删除</button>
          </div>
        </td>
      `;
    }

    function itemProgress(item) {
      const rawProgress = Number(item.progress || 0);
      const progress = Math.max(0, Math.min(100, Number.isFinite(rawProgress) ? rawProgress : 0));
      const active = ['queued', 'processing'].includes(item.status);
      const displayProgress = active ? Math.max(progress, 8) : progress;
      const text = `${Math.round(progress)}% ${item.message || ''}`.trim();
      return `
        <div class="item-progress ${active ? 'is-active' : ''}">
          <div class="item-progress-track" aria-label="${escapeHtml(text)}">
            <div class="item-progress-fill" style="width: ${displayProgress}%"></div>
          </div>
          <div class="small-muted">${escapeHtml(text)}</div>
        </div>
      `;
    }

    function buildDxfCell(item) {
      const urls = item.urls || {};
      const paths = item.paths || {};
      if (!urls.dxf) {
        return '<span class="small-muted">未生成</span>';
      }
      const name = basename(paths.dxf || 'plate.dxf');
      const preview = urls.dxf_preview
        ? `<a href="${urls.dxf_preview}" target="_blank"><img class="dxf-preview-image" src="${urls.dxf_preview}" alt="DXF 预览"></a>`
        : '<div class="dxf-preview-placeholder">暂无预览</div>';
      return `
        <div class="dxf-result">
          ${preview}
          <div class="min-w-0">
            <div class="dxf-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
          </div>
          <div class="dxf-actions">
            <a class="btn btn-outline-primary btn-sm" href="${urls.dxf}" target="_blank">${iconSvg('file')}打开 DXF</a>
            ${urls.dxf_preview ? `<a class="btn btn-outline-secondary btn-sm" href="${urls.dxf_preview}" target="_blank">${iconSvg('image')}打开预览</a>` : ''}
          </div>
        </div>
      `;
    }

    function attributeLine(label, value) {
      const text = value || '-';
      const labelClass = String(label || '').trim().length > 4 ? 'attribute-label large' : 'attribute-label';
      return `
        <div class="attribute-line" title="${escapeHtml(text)}">
          <span class="${labelClass}">${escapeHtml(label)}:</span>
          <span class="attribute-value">${escapeHtml(text)}</span>
        </div>
      `;
    }

    function attributeStack(lines) {
      return `<div class="attribute-stack">${lines.join('')}</div>`;
    }

    function dimensionValue(source, firstKey, secondKey) {
      const data = source || {};
      const first = data[firstKey];
      const second = data[secondKey];
      if (first === null || first === undefined || first === '' || second === null || second === undefined || second === '') {
        return '';
      }
      return `${formatNumber(first)} x ${formatNumber(second)} mm`;
    }

    function buildRecognitionParamsCell(item) {
      const notchSize = `${formatNumber(item.dxf_notch_fill_max_width_mm)} x ${formatNumber(item.dxf_notch_fill_max_depth_mm)} mm`;
      const columns = [
        attributeStack([
          attributeLine('A4识别', paperSourceLabel(item.paper_source)),
          attributeLine('A4方向', a4OrientationLabel(item.a4_orientation)),
          attributeLine('钢板透视', item.use_plate_perspective ? '是' : '否'),
          attributeLine('钢板点', pointRatioLabel(item.plate_point_ratio)),
        ]),
        attributeStack([
          attributeLine('夹钳修复', item.dxf_notch_fill_enabled ? '是' : '否'),
          attributeLine('夹钳尺寸', notchSize),
          attributeLine('A4点', pointRatioLabel(item.paper_point_ratio)),
          attributeLine('状态', item.status || '-'),
        ]),
      ];
      return `<div class="params-grid">${columns.join('')}</div>`;
    }

    function buildDimensionsCell(item) {
      const settings = [];
      if (item.dxf_target_size_1_mm || item.dxf_target_size_2_mm) {
        settings.push(`尺寸1/2：${formatNumber(item.dxf_target_size_1_mm)} / ${formatNumber(item.dxf_target_size_2_mm)} mm`);
      }
      if (item.dxf_target_x_mm || item.dxf_target_y_mm) {
        settings.push(`X/Y：${formatNumber(item.dxf_target_x_mm)} / ${formatNumber(item.dxf_target_y_mm)} mm`);
      }

      const detected = item.detected_plate_dimensions || {};
      const finalSize = item.plate_dimensions || {};
      const dxfOutput = dimensionPair(item.dxf_target_size, [
        ['output_x_mm', 'output_y_mm'],
        ['target_x_mm', 'target_y_mm'],
      ]);

      const columns = [
        attributeStack([
          attributeLine('设置尺寸', settings.length ? settings.join('；') : '未指定'),
          attributeLine('DXF输出', dxfOutput || dimensionValue(finalSize, 'axis_bbox_width_mm', 'axis_bbox_height_mm')),
          attributeLine('面积', item.plate_dimensions && item.plate_dimensions.area_m2 ? `${formatNumber(item.plate_dimensions.area_m2)} m²` : '-'),
        ]),
        attributeStack([
          attributeLine('最大长宽', dimensionValue(finalSize, 'max_length_mm', 'max_width_mm') || dimensionValue(finalSize, 'length_mm', 'width_mm')),
          attributeLine('最小长宽', dimensionValue(finalSize, 'min_length_mm', 'min_width_mm')),
          attributeLine('轴向外框', dimensionValue(finalSize, 'axis_bbox_width_mm', 'axis_bbox_height_mm')),
        ]),
        attributeStack([
          attributeLine('识别最大', dimensionValue(detected, 'max_length_mm', 'max_width_mm') || dimensionValue(detected, 'length_mm', 'width_mm')),
          attributeLine('识别最小', dimensionValue(detected, 'min_length_mm', 'min_width_mm')),
          attributeLine('识别外框', dimensionValue(detected, 'axis_bbox_width_mm', 'axis_bbox_height_mm')),
        ]),
      ];
      return `<div class="dimension-grid">${columns.join('')}</div>`;
    }

    function buildOtherResultLinks(item) {
      const urls = item.urls || {};
      const links = [];
      if (urls.result_json) links.push(`<a class="btn btn-outline-secondary btn-sm" href="${urls.result_json}" target="_blank">${iconSvg('code')}JSON</a>`);
      return links.length ? `<div class="result-links d-flex flex-wrap gap-1">${links.join('')}</div>` : '<span class="small-muted">暂无</span>';
    }

    function openItemModal(item = null) {
      state.editingItem = item;
      els.itemModalTitle.textContent = item ? '编辑数据' : '新增数据';
      els.imageHelp.textContent = item ? '不选择图片则保留原图。' : '新增数据必须选择图片。';
      els.itemImage.value = '';
      els.plateNo.value = item ? item.plate_no || '' : '';
      els.quantity.value = item && item.quantity != null ? item.quantity : '';
      els.material.value = item ? item.material || '' : '';
      els.thickness.value = item && item.thickness_mm != null ? item.thickness_mm : '';
      els.size1.value = item && item.dxf_target_size_1_mm != null ? item.dxf_target_size_1_mm : '';
      els.size2.value = item && item.dxf_target_size_2_mm != null ? item.dxf_target_size_2_mm : '';
      els.targetX.value = item && item.dxf_target_x_mm != null ? item.dxf_target_x_mm : '';
      els.targetY.value = item && item.dxf_target_y_mm != null ? item.dxf_target_y_mm : '';
      els.paperSource.value = !item || item.paper_source === 'sam2' ? 'standard' : 'training';
      els.a4Orientation.value = item && item.a4_orientation ? item.a4_orientation : 'auto';
      els.usePlatePerspective.checked = !!(item && item.use_plate_perspective);
      els.platePointRatio.value = item ? item.plate_point_ratio || '' : '';
      els.paperPointRatio.value = item ? item.paper_point_ratio || '' : '';
      els.notchEnabled.checked = !!(item && item.dxf_notch_fill_enabled);
      els.notchWidth.value = item && item.dxf_notch_fill_max_width_mm != null ? item.dxf_notch_fill_max_width_mm : 200;
      els.notchDepth.value = item && item.dxf_notch_fill_max_depth_mm != null ? item.dxf_notch_fill_max_depth_mm : 200;
      setItemImagePreview(item && item.urls ? item.urls.image : '');
      setMessage(els.itemFormMessage, '');
      showModal('itemModal');
    }

    function collectItemFormData(requireImage) {
      if (!state.selectedId) {
        throw new Error('请先选择数据集');
      }
      const form = new FormData();
      const file = els.itemImage.files[0];
      if (file) {
        form.append('image', file);
      } else if (requireImage) {
        throw new Error('请上传图片');
      }
      appendValue(form, 'plate_no', els.plateNo.value);
      appendValue(form, 'quantity', els.quantity.value);
      appendValue(form, 'material', els.material.value);
      appendValue(form, 'thickness_mm', els.thickness.value);
      appendValue(form, 'dxf_target_size_1_mm', els.size1.value);
      appendValue(form, 'dxf_target_size_2_mm', els.size2.value);
      appendValue(form, 'dxf_target_x_mm', els.targetX.value);
      appendValue(form, 'dxf_target_y_mm', els.targetY.value);
      appendValue(form, 'paper_source', els.paperSource.value || 'standard');
      appendValue(form, 'a4_orientation', els.a4Orientation.value || 'auto');
      appendValue(form, 'plate_point_ratio', els.platePointRatio.value);
      appendValue(form, 'paper_point_ratio', els.paperPointRatio.value);
      form.append('use_plate_perspective', els.usePlatePerspective.checked ? 'true' : 'false');
      form.append('dxf_notch_fill_enabled', els.notchEnabled.checked ? 'true' : 'false');
      appendValue(form, 'dxf_notch_fill_max_width_mm', els.notchWidth.value || '200');
      appendValue(form, 'dxf_notch_fill_max_depth_mm', els.notchDepth.value || '200');
      return form;
    }

    function appendValue(form, key, value) {
      form.append(key, value == null ? '' : String(value).trim());
    }

    function appendItemFields(form, item, overrides = {}) {
      const source = { ...(item || {}), ...overrides };
      appendValue(form, 'plate_no', source.plate_no);
      appendValue(form, 'quantity', source.quantity);
      appendValue(form, 'material', source.material);
      appendValue(form, 'thickness_mm', source.thickness_mm);
      appendValue(form, 'dxf_target_size_1_mm', source.dxf_target_size_1_mm);
      appendValue(form, 'dxf_target_size_2_mm', source.dxf_target_size_2_mm);
      appendValue(form, 'dxf_target_x_mm', source.dxf_target_x_mm);
      appendValue(form, 'dxf_target_y_mm', source.dxf_target_y_mm);
      appendValue(form, 'paper_source', source.paper_source === 'yolo' ? 'training' : 'standard');
      appendValue(form, 'a4_orientation', source.a4_orientation || 'auto');
      appendValue(form, 'plate_point_ratio', source.plate_point_ratio);
      appendValue(form, 'paper_point_ratio', source.paper_point_ratio);
      form.append('use_plate_perspective', source.use_plate_perspective ? 'true' : 'false');
      form.append('dxf_notch_fill_enabled', source.dxf_notch_fill_enabled ? 'true' : 'false');
      appendValue(form, 'dxf_notch_fill_max_width_mm', source.dxf_notch_fill_max_width_mm || '200');
      appendValue(form, 'dxf_notch_fill_max_depth_mm', source.dxf_notch_fill_max_depth_mm || '200');
      return form;
    }

    function openPointPicker(item) {
      if (!item || !item.urls || !item.urls.image) return;
      state.pointPickingItem = item;
      state.pointPickingMode = 'plate';
      state.pointDraft = {
        plate: item.plate_point_ratio || '',
        paper: item.paper_point_ratio || '',
      };
      els.pointPickerImage.src = item.urls.image;
      setPointPickerMode('plate');
      updatePointMarkers();
      setMessage(els.pointPickerMessage, '当前模式：指定钢板点。请点击钢板内部可靠位置。');
      showModal('pointPickerModal');
    }

    function setPointPickerMode(mode) {
      state.pointPickingMode = mode === 'paper' ? 'paper' : 'plate';
      const plateActive = state.pointPickingMode === 'plate';
      els.pickPlatePointBtn.className = `btn ${plateActive ? 'btn-primary' : 'btn-outline-primary'} btn-sm`;
      els.pickPaperPointBtn.className = `btn ${plateActive ? 'btn-outline-primary' : 'btn-primary'} btn-sm`;
      setMessage(
        els.pointPickerMessage,
        plateActive ? '当前模式：指定钢板点。请点击钢板内部可靠位置。' : '当前模式：指定A4纸点。请点击白纸内部可靠位置。'
      );
    }

    function formatPointRatio(rx, ry) {
      return `${rx.toFixed(8)},${ry.toFixed(8)}`;
    }

    function parsePointRatio(value) {
      if (!value) return null;
      const parts = String(value).split(',').map(part => Number(part));
      if (parts.length !== 2 || parts.some(part => !Number.isFinite(part))) return null;
      return { rx: Math.max(0, Math.min(1, parts[0])), ry: Math.max(0, Math.min(1, parts[1])) };
    }

    function updatePointMarkers() {
      updateOnePointMarker(els.platePointMarker, state.pointDraft.plate);
      updateOnePointMarker(els.paperPointMarker, state.pointDraft.paper);
    }

    function updateOnePointMarker(marker, ratioValue) {
      const ratio = parsePointRatio(ratioValue);
      if (!ratio) {
        marker.hidden = true;
        return;
      }
      marker.style.left = `${ratio.rx * 100}%`;
      marker.style.top = `${ratio.ry * 100}%`;
      marker.hidden = false;
    }

    function handlePointPickerClick(event) {
      if (!state.pointPickingItem) return;
      const rect = els.pointPickerImage.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const rx = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      const ry = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
      const value = formatPointRatio(rx, ry);
      if (state.pointPickingMode === 'paper') {
        state.pointDraft.paper = value;
      } else {
        state.pointDraft.plate = value;
      }
      updatePointMarkers();
      setMessage(els.pointPickerMessage, `${state.pointPickingMode === 'paper' ? 'A4纸点' : '钢板点'}已记录：${pointRatioLabel(value)}`, 'success');
    }

    async function savePointPicker() {
      const item = state.pointPickingItem;
      if (!state.selectedId || !item) return;
      const form = new FormData();
      form.append('plate_point_ratio', state.pointDraft.plate || '');
      form.append('paper_point_ratio', state.pointDraft.paper || '');
      setButtonLoading(els.savePointPickerBtn, true, '保存中...');
      setMessage(els.pointPickerMessage, '正在保存点坐标...');
      try {
        const payload = await request(`/datasets/${state.selectedId}/items/${item.id}/points`, { method: 'PATCH', body: form });
        if (state.selected && payload.item) {
          const index = (state.selected.items || []).findIndex(row => row.id === payload.item.id);
          if (index >= 0) {
            state.selected.items[index] = payload.item;
          }
        }
        renderSelectedDataset();
        hideModal('pointPickerModal');
        setMessage(els.detailMessage, '点坐标已保存', 'success');
      } catch (error) {
        showError(els.pointPickerMessage, error);
      } finally {
        setButtonLoading(els.savePointPickerBtn, false);
      }
    }

    async function saveItem(event) {
      event.preventDefault();
      setMessage(els.itemFormMessage, '正在保存...');
      try {
        const isEdit = !!state.editingItem;
        const form = collectItemFormData(!isEdit);
        const path = isEdit
          ? `/datasets/${state.selectedId}/items/${state.editingItem.id}`
          : `/datasets/${state.selectedId}/items`;
        const method = isEdit ? 'PUT' : 'POST';
        const payload = await request(path, { method, body: form });
        state.selected = payload.dataset;
        renderSelectedDataset();
        hideModal('itemModal');
        await loadDatasets(state.selectedId);
      } catch (error) {
        showError(els.itemFormMessage, error);
      }
    }

    async function createDataset(event) {
      event.preventDefault();
      els.datasetName.classList.remove('is-invalid');
      els.datasetNameError.textContent = '';
      const form = new FormData();
      form.append('name', els.datasetName.value.trim());
      try {
        const payload = await request('/datasets', { method: 'POST', body: form });
        els.datasetName.value = '';
        hideModal('datasetModal');
        await loadDatasets(payload.dataset.id);
      } catch (error) {
        els.datasetName.classList.add('is-invalid');
        els.datasetNameError.textContent = String(error.detail || error || '创建失败');
      }
    }

    async function importExcelFile(file) {
      if (!file) return;
      const form = new FormData();
      form.append('excel', file);
      form.append('name', '');
      setMessage(els.listMessage, '正在导入 Excel...');
      setButtonLoading(els.uploadExcelBtn, true, '正在上传...');
      els.downloadTemplateBtn.disabled = true;
      try {
        const payload = await request('/datasets/import-excel', { method: 'POST', body: form });
        els.excelFile.value = '';
        await loadDatasets(payload.dataset.id);
        setMessage(els.listMessage, 'Excel 导入完成', 'success');
      } catch (error) {
        showError(els.listMessage, error);
      } finally {
        setButtonLoading(els.uploadExcelBtn, false);
        els.downloadTemplateBtn.disabled = false;
      }
    }

    async function copySelectedDataset() {
      if (!state.selectedId) return;
      setMessage(els.detailMessage, '正在复制...');
      try {
        const payload = await request(`/datasets/${state.selectedId}/copy`, { method: 'POST', body: new FormData() });
        await loadDatasets(payload.dataset.id);
        setMessage(els.detailMessage, '已复制', 'success');
      } catch (error) {
        showError(els.detailMessage, error);
      }

    async function deleteSelectedDataset() {
      if (!state.selectedId || !state.selected) return;
      if (!window.confirm(`确认删除数据集“${state.selected.name}”？`)) return;
      setButtonLoading(els.deleteDatasetBtn, true, '正在删除...');
      setMessage(els.detailMessage, '正在删除...');
      try {
        await request(`/datasets/${state.selectedId}`, { method: 'DELETE' });
        const currentIndex = state.datasets.findIndex(item => item.id === state.selectedId);
        const nextDataset = state.datasets[currentIndex + 1] || state.datasets[currentIndex - 1];
        await loadDatasets(nextDataset ? nextDataset.id : null);
        setMessage(els.detailMessage, '已删除', 'success');
      } catch (error) {
        showError(els.detailMessage, error);
      } finally {
        setButtonLoading(els.deleteDatasetBtn, false);
        renderSelectedDataset();
      }
    }

    async function recognizeSelectedDataset() {
      if (!state.selectedId) return;
      setButtonLoading(els.recognizeDatasetBtn, true, '提交中...');
      setMessage(els.detailMessage, '已提交识别任务...');
      try {
        const form = new FormData();
        if (DATASET_SAM_MODEL.trim()) {
          form.append('sam_model', DATASET_SAM_MODEL.trim());
        }
        const payload = await request(`/datasets/${state.selectedId}/recognize`, { method: 'POST', body: form });
        state.selected = payload.dataset;
        renderSelectedDataset();
        startOrStopPolling();

        showError(els.detailMessage, error);

        setButtonLoading(els.recognizeDatasetBtn, false);
        renderSelectedDataset();
      }

      if (!state.selectedId) return;

    async function importSelectedDatasetToExpert() {
      if (!state.selectedId || !state.selected || state.importInProgress) return;
      state.importInProgress = true;
      renderSelectedDataset();
      setMessage(els.detailMessage, '');
      startExpertFakeProgress((state.selected.items || []).length);
      try {
        const payload = await request(`/datasets/${state.selectedId}/import-expert`, { method: 'POST' });
        finishExpertFakeProgress(payload.message || '命令已执行完成，请打开套料软件确认是否成功导入');
      } catch (error) {
        stopExpertFakeProgress();
        showError(els.detailMessage, error);
      } finally {
        state.importInProgress = false;
        renderSelectedDataset();
      }
    }

    function startExpertFakeProgress(itemCount) {
      stopExpertFakeProgress();
      state.importStartedAt = Date.now();
      state.importDurationMs = Math.max(1, Number(itemCount || 0)) * 3500 + 5000;
      setExpertProgress(3, '正在准备导入文件...');
      state.importTimer = setInterval(() => {
        const elapsed = Date.now() - state.importStartedAt;
        const percent = Math.min(95, Math.round((elapsed / state.importDurationMs) * 100));
        setExpertProgress(percent, `正在执行导入命令，预计 ${Math.ceil(Math.max(0, state.importDurationMs - elapsed) / 1000)} 秒`);
      }, 300);
    }

    function finishExpertFakeProgress(text) {
      stopExpertFakeProgress();
      setExpertProgress(100, text);
      setMessage(els.detailMessage, text, 'success');
    }

    function stopExpertFakeProgress() {
      if (state.importTimer) {
        clearInterval(state.importTimer);
        state.importTimer = null;
      }
    }

    function hideExpertProgress() {
      stopExpertFakeProgress();
      els.expertImportProgress.hidden = true;
      els.expertImportProgressFill.style.width = '0%';
      els.expertImportProgressText.textContent = '';
    }

    function setExpertProgress(percent, text) {
      els.expertImportProgress.hidden = false;
      els.expertImportProgressFill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
      els.expertImportProgressText.textContent = text || '';
    }

      }
    }

    function startOrStopPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
      state.pollInFlight = false;
      if (state.selected && state.selected.status === 'recognizing') {
        state.pollTimer = setInterval(async () => {
          if (state.pollInFlight) return;
          state.pollInFlight = true;
          try {
            const payload = await request(`/datasets/${state.selectedId}`);
            state.selected = payload.dataset;
            renderSelectedDataset();
            if (state.selected.status !== 'recognizing') {
              startOrStopPolling();
              await loadDatasets(state.selectedId);
            }
          } catch (error) {
            showError(els.detailMessage, error);
            startOrStopPolling();
          } finally {
            state.pollInFlight = false;
          }
        }, 2000);
      }
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function formatNumber(value) {
      if (value === null || value === undefined || value === '') return '-';
      const number = Number(value);
      if (!Number.isFinite(number)) return String(value);
      return Number.isInteger(number) ? String(number) : number.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    }

    function dimensionPair(source, pairs) {
      const data = source || {};
      for (const [firstKey, secondKey] of pairs) {
        const first = data[firstKey];
        const second = data[secondKey];
        if (first !== null && first !== undefined && first !== '' && second !== null && second !== undefined && second !== '') {
          return `${formatNumber(first)} x ${formatNumber(second)} mm`;
        }
      }
      return '';
    }

    function basename(value) {
      return String(value || '').split(/[\\/]/).filter(Boolean).pop() || '';
    }

    function iconSvg(name) {
      const icons = {
        refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
        plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
        upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
        play: '<path d="M5 5v14l14-7Z"/>',
        settings: '<path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.36a1.7 1.7 0 0 0-1 .64 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.6 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.24 15a1.7 1.7 0 0 0-.64-1A1.7 1.7 0 0 0 2.5 13H2a2 2 0 1 1 0-4h.5a1.7 1.7 0 0 0 1.74-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 6.67 3.24l.06.06A1.7 1.7 0 0 0 8.6 3.64 1.7 1.7 0 0 0 9.6 2.1V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.54 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.76 8c.14.38.37.72.64 1H22a2 2 0 1 1 0 4h-.5a1.7 1.7 0 0 0-1.1 2Z"/>',
        copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
        edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
        code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
        rotate: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/>',
        save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      };
      return `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || ''}</svg>`;
    }

    function setButtonIcon(element, iconName) {
      if (!element || element.querySelector('.icon-svg')) return;
      element.insertAdjacentHTML('afterbegin', iconSvg(iconName));
    }

    function decorateStaticButtons() {
      setButtonIcon(els.refreshBtn, 'refresh');
      setButtonIcon(els.openCreateDatasetBtn, 'plus');
      setButtonIcon(els.uploadExcelBtn, 'upload');
      setButtonIcon(els.downloadTemplateBtn, 'download');
      setButtonIcon(els.openItemBtn, 'plus');
      setButtonIcon(els.recognizeDatasetBtn, 'play');
      setButtonIcon(els.clearDatasetRecognitionBtn, 'rotate');
      setButtonIcon(els.importSettingsBtn, 'settings');
      setButtonIcon(els.importExpertBtn, 'upload');
      setButtonIcon(els.copyDatasetBtn, 'copy');
      setButtonIcon(els.downloadDxfBtn, 'download');
      setButtonIcon(els.deleteDatasetBtn, 'trash');
      setButtonIcon(els.saveItemBtn, 'save');
      setButtonIcon(document.querySelector('#createDatasetForm button[type="submit"]'), 'plus');
      setButtonIcon(document.querySelector('#importSettingsForm button[type="submit"]'), 'save');
      document.querySelectorAll('[data-close-modal]:not(.btn-close)').forEach(button => setButtonIcon(button, 'x'));
    }

    function setupColumnResize() {
      if (!els.dataTable) return;
      const headers = Array.from(els.dataTable.querySelectorAll('th[data-col]'));
      headers.forEach(header => {
        if (header.querySelector('.column-resizer')) return;
        header.classList.add('resizable');
        const handle = document.createElement('span');
        handle.className = 'column-resizer';
        handle.setAttribute('aria-hidden', 'true');
        header.appendChild(handle);

        let startX = 0;
        let startWidth = 0;
        let targetCol = null;

        const stopResize = () => {
          handle.classList.remove('active');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          document.removeEventListener('mousemove', moveResize);
          document.removeEventListener('mouseup', stopResize);
        };

        const moveResize = (event) => {
          if (!targetCol) return;
          const minWidth = header.dataset.col === 'image' ? 82 : 96;
          const nextWidth = Math.max(minWidth, Math.round(startWidth + event.clientX - startX));
          targetCol.style.width = `${nextWidth}px`;
        };

        handle.addEventListener('mousedown', event => {
          event.preventDefault();
          event.stopPropagation();
          startX = event.clientX;
          startWidth = header.getBoundingClientRect().width;
          targetCol = els.dataTable.querySelector(`col[data-col="${header.dataset.col}"]`);
          handle.classList.add('active');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          document.addEventListener('mousemove', moveResize);
          document.addEventListener('mouseup', stopResize);
        });
      });
    }

    function setButtonLoading(button, loading, text) {
      if (!button) return;
      if (!button.dataset.idleHtml) {
        button.dataset.idleHtml = button.innerHTML;
      }
      button.disabled = !!loading;
      button.innerHTML = loading
        ? `<span class="btn-loading-spinner" aria-hidden="true"></span>${escapeHtml(text || '处理中...')}`
        : button.dataset.idleHtml;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    els.refreshBtn.addEventListener('click', () => loadDatasets());
    els.openCreateDatasetBtn.addEventListener('click', () => {
      els.datasetName.value = '';
      els.datasetName.classList.remove('is-invalid');
      els.datasetNameError.textContent = '';
      showModal('datasetModal');
      setTimeout(() => els.datasetName.focus(), 0);
    });
    els.uploadExcelBtn.addEventListener('click', () => els.excelFile.click());
    els.excelFile.addEventListener('change', () => importExcelFile(els.excelFile.files[0]));
    els.createDatasetForm.addEventListener('submit', createDataset);
    els.downloadTemplateBtn.addEventListener('click', () => downloadFile('/datasets/excel-template', 'dataset_template.xlsx').catch(error => showError(els.listMessage, error)));
    els.openItemBtn.addEventListener('click', () => openItemModal(null));
    els.importSettingsBtn.addEventListener('click', openImportSettingsModal);
    els.importSettingsForm.addEventListener('submit', saveImportSettings);
    els.importExpertBtn.addEventListener('click', importSelectedDatasetToExpert);
    els.copyDatasetBtn.addEventListener('click', copySelectedDataset);
    els.deleteDatasetBtn.addEventListener('click', deleteSelectedDataset);
    els.recognizeDatasetBtn.addEventListener('click', recognizeSelectedDataset);
    els.clearDatasetRecognitionBtn.addEventListener('click', clearSelectedDatasetRecognition);
    els.downloadDxfBtn.addEventListener('click', () => {
      if (!state.selectedId) return;
      downloadFile(`/datasets/${state.selectedId}/download-dxf`, `${state.selected.name}_dxf.zip`).catch(error => showError(els.detailMessage, error));
    });
    els.itemFilter.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-filter]');
      if (!button) return;
      state.itemFilter = button.dataset.filter || 'pending';
      renderSelectedDataset();
    });
    els.pickPlatePointBtn.addEventListener('click', () => setPointPickerMode('plate'));
    els.pickPaperPointBtn.addEventListener('click', () => setPointPickerMode('paper'));
    els.clearPlatePointBtn.addEventListener('click', () => {
      state.pointDraft.plate = '';
      updatePointMarkers();
      setMessage(els.pointPickerMessage, '已清除钢板点');
    });
    els.clearPaperPointBtn.addEventListener('click', () => {
      state.pointDraft.paper = '';
      updatePointMarkers();
      setMessage(els.pointPickerMessage, '已清除A4纸点');
    });
    els.pointPickerStage.addEventListener('click', handlePointPickerClick);
    els.savePointPickerBtn.addEventListener('click', savePointPicker);
    els.itemImage.addEventListener('change', updateItemImagePreview);
    els.itemForm.addEventListener('submit', saveItem);
    els.itemsBody.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button || !state.selected) return;
      const item = state.selected.items.find(row => row.id === button.dataset.id);
      if (button.dataset.action === 'pick-points' && item) {
        openPointPicker(item);
        return;
      }
      if (button.dataset.action === 'edit' && item) {
        openItemModal(item);
      }
      if (button.dataset.action === 'delete') {
        deleteItem(button.dataset.id);
      }
      if (button.dataset.action === 'clear-recognition') {
        clearItemRecognition(button.dataset.id);
      }
    });
    document.addEventListener('click', (event) => {
      const closeButton = event.target.closest('[data-close-modal]');
      if (closeButton) {
        hideModal(closeButton.dataset.closeModal);
      }
      if (event.target.classList.contains('modal')) {
        hideModal(event.target.id);
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        document.querySelectorAll('.modal.show').forEach(modal => hideModal(modal.id));
      }
    });

    decorateStaticButtons();
    setupColumnResize();
    loadDatasets();
  </script>
</body>
</html>
