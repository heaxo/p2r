<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pic2Remnant - 批量识别</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d8dee5;
      --primary: #2D579B;
      --primary-dark: #23467d;
      --green: #15803d;
      --amber: #b45309;
      --red: #b91c1c;
      --slate: #334155;
      --soft-blue: #eef4fb;
      --soft-green: #ecfdf3;
      --soft-amber: #fffbeb;
      --soft-red: #fef2f2;
      --shadow: 0 10px 24px rgba(15, 23, 42, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: calc(100% - 16px);
      margin: 0 auto;
      padding: 10px 0 18px;
    }

    .topbar {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 0 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .top-title-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .client-id {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #f8fafc;
      padding: 3px;
    }

    .top-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 5px;
      color: #344054;
      font-size: 13px;
      text-decoration: none;
      white-space: nowrap;
    }

    .top-link.active {
      background: #fff;
      color: var(--primary-dark);
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .12);
    }

    .grid {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 800;
    }

    .title-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .panel-body { padding: 10px; }

    .upload-zone {
      min-height: 104px;
      border: 2px dashed #9fb2c7;
      border-radius: 8px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }

    .upload-zone:hover,
    .upload-zone.dragging {
      border-color: var(--primary);
      background: var(--soft-blue);
    }

    .upload-zone strong {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .upload-zone span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    input[type="file"] { display: none; }

    .field {
      margin-top: 8px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }

    select,
    input[type="number"] {
      width: 100%;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: #344054;
      font-size: 13px;
      cursor: pointer;
    }

    .notch-options {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .field-note {
      margin-top: 8px;
      padding: 8px 9px;
      border-radius: 6px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .selected-files {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 460px;
      overflow: auto;
      background: #fff;
    }

    .selected-files.empty {
      border-style: dashed;
      color: var(--muted);
      padding: 12px;
      font-size: 13px;
    }

    .selected-file {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #eef2f6;
      font-size: 12px;
    }

    .selected-file:last-child { border-bottom: 0; }

    .selected-file-name {
      min-width: 0;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .selected-thumb,
    .task-thumb {
      width: 52px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 5px;
      object-fit: cover;
      background: #f8fafc;
      display: block;
    }

    .selected-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 8px;
      margin-top: 6px;
      color: #344054;
    }

    .selected-options label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      font-size: 12px;
    }

    .selected-options input[type="number"] {
      height: 28px;
      padding: 4px 6px;
      font-size: 12px;
    }

    .selected-size-values {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 7px;
      border: 1px solid #edf1f5;
      border-radius: 6px;
      background: #f8fafc;
    }

    .selected-options .selected-number-field {
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .selected-options .selected-number-field input {
      background: #fff;
      color: var(--text);
    }

    .selected-size-values.explicit-size-values {
      background: #fff;
    }

    .selected-notch-values {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    button,
    .link-btn {
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
    }

    button .icon-svg,
    .link-btn .icon-svg,
    .btn-small .icon-svg {
      width: 14px;
      height: 14px;
      margin-right: 5px;
      vertical-align: -2px;
      stroke-width: 2.2;
    }

    button:disabled {
      opacity: .58;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-muted {
      background: #eef2f7;
      color: var(--slate);
    }

    .btn-danger {
      background: var(--soft-red);
      color: var(--red);
    }

    .btn-small {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 6px 9px;
      font-size: 12px;
      border-radius: 5px;
      background: #eef2f7;
      color: var(--slate);
      text-decoration: none;
    }

    .status-box {
      margin-top: 8px;
      border-radius: 6px;
      padding: 10px 11px;
      background: #f3f5f7;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .status-box.ok { background: var(--soft-green); color: var(--green); }
    .status-box.error { background: var(--soft-red); color: var(--red); }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 24vw);
      gap: 10px;
    }

    .table-wrap {
      overflow-y: auto;
      overflow-x: hidden;
      max-height: calc(100vh - 86px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 7px 8px;
      border-bottom: 1px solid #edf1f5;
      text-align: left;
      vertical-align: top;
      font-size: 12px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
      color: #475467;
      font-size: 12px;
      font-weight: 800;
    }

    th:nth-child(1), td:nth-child(1) { width: 9%; }
    th:nth-child(2), td:nth-child(2) { width: 24%; }
    th:nth-child(3), td:nth-child(3) { width: 15%; }
    th:nth-child(4), td:nth-child(4) { width: 12%; }
    th:nth-child(5), td:nth-child(5) { width: 19%; }
    th:nth-child(6), td:nth-child(6) { width: 11%; }
    th:nth-child(7), td:nth-child(7) { width: 10%; }

    tr.selected {
      background: #f8fbff;
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .file-name {
      max-width: 100%;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-cell {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 7px;
      align-items: start;
    }

    .file-cell .task-thumb {
      width: 44px;
      height: 36px;
    }

    .dxf-thumb-button {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px;
      background: #fff;
      min-height: 0;
      width: 62px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dxf-thumb-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 3px;
    }

    .thumb-empty {
      width: 62px;
      height: 48px;
      border: 1px dashed var(--border);
      border-radius: 5px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }

    .subtext {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .pill.queued { background: #eef2f7; color: var(--slate); }
    .pill.processing { background: var(--soft-amber); color: var(--amber); }
    .pill.completed { background: var(--soft-green); color: var(--green); }
    .pill.failed { background: var(--soft-red); color: var(--red); }

    .progress {
      width: 100%;
      min-width: 70px;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e6ebf1;
      margin-top: 7px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--primary);
      transition: width .2s ease;
    }

    .progress-fill.processing {
      background: linear-gradient(90deg, var(--amber), #f59e0b);
      animation: pulse 1s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: .62; }
      to { opacity: 1; }
    }

    .metric-line {
      color: #344054;
      line-height: 1.32;
      white-space: normal;
    }

    .preview-empty {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
    }

    .dxf-preview {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .dxf-preview img {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      display: block;
      background: #fff;
      border-radius: 6px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin: 8px 0;
    }

    .metric {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px;
      background: #fff;
    }

    .metric .name {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric .value {
      font-weight: 900;
      font-size: 14px;
      word-break: break-word;
    }

    .download-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    .link-btn {
      min-height: 34px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
    }

    .link-btn.secondary {
      background: var(--slate);
    }

    details {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 800;
      font-size: 13px;
    }

    .debug-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 0 12px 12px;
    }

    .debug-card {
      border: 1px solid #edf1f5;
      border-radius: 6px;
      padding: 8px;
    }

    .debug-card h3 {
      margin: 0 0 7px;
      font-size: 12px;
      color: #475467;
    }

    .debug-card img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      display: block;
      background: #f8fafc;
      border-radius: 4px;
    }

    .empty-table {
      padding: 38px 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 1180px) {
      .grid,
      .content-grid {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        max-height: none;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: calc(100% - 10px);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        height: auto;
        padding: 8px 10px;
      }

      .actions,
      .notch-options,
      .selected-size-values,
      .metric-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Pic2Remnant</h1>
        <div class="top-title-meta">批量识别</div>
      </div>
      <div class="top-right">
        <nav class="top-actions" aria-label="页面导航">
          <a class="top-link" href="/ui/datasets.html">数据集</a>
          <a class="top-link active" href="/ui/">批量识别</a>
        </nav>
        <div class="client-id" id="clientIdText"></div>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <div class="panel-title">
          <span>上传与参数</span>
        </div>
        <div class="panel-body">
          <form id="uploadForm">
            <div class="upload-zone" id="uploadZone">
              <div>
                <strong>选择或拖入图片</strong>
                <span>支持多选，上传后会进入当前客户端任务列表。</span>
              </div>
            </div>
            <input id="imageInput" type="file" accept="image/*" multiple />

            <div class="selected-files empty" id="selectedFiles">尚未选择文件</div>

            <div class="field-note">
              优先填写“目标尺寸1/2”，系统会自动把较大值匹配到识别后较大的 X/Y 方向；留空时可使用指定 X/Y。
            </div>

            <div class="actions">
              <button class="btn-primary" id="submitBtn" type="submit">上传并识别</button>
              <button class="btn-danger" id="clearBtn" type="button">清除列表</button>
            </div>
          </form>

          <div class="status-box" id="statusBox">等待选择图片。</div>
        </div>
      </section>

      <section class="content-grid">
        <section class="panel">
          <div class="panel-title">
            <span>任务列表</span>
            <div class="title-actions">
              <button class="btn-small" id="downloadDxfBtn" type="button">批量下载DXF</button>
              <button class="btn-small" id="refreshBtn" type="button">刷新</button>
            </div>
          </div>
          <div class="table-wrap" id="taskTableWrap"></div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>DXF 预览</span>
          </div>
          <div class="panel-body" id="previewPanel">
            <div class="preview-empty">完成识别后，这里显示最终 DXF 图形。</div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const AUTH_TOKEN = 'tk_c2VjcmV0LXJhbmRvbS10b2tlbi0xMjM0NTY3OA';
    const CLIENT_KEY = 'plate_dxf_client_id';

    const uploadForm = document.getElementById('uploadForm');
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const selectedFilesBox = document.getElementById('selectedFiles');
    const submitBtn = document.getElementById('submitBtn');
    const clearBtn = document.getElementById('clearBtn');
    const downloadDxfBtn = document.getElementById('downloadDxfBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusBox = document.getElementById('statusBox');
    const taskTableWrap = document.getElementById('taskTableWrap');
    const previewPanel = document.getElementById('previewPanel');
    const clientIdText = document.getElementById('clientIdText');

    let selectedFiles = [];
    let tasks = [];
    let selectedTaskId = null;
    let pollingTimer = null;
    let detailOpenByTask = {};
    let isDownloadingDxf = false;

    const detailImages = [
      ['upload', '原图'],
      ['debug_overlay', '识别叠加图'],
      ['debug_mm_preview', '尺寸预览'],
      ['debug_dxf_postprocess_preview', 'DXF 后处理预览'],
      ['topdown_image', '俯视图'],
      ['topdown_overlay', '俯视叠加图'],
      ['plate_final_with_paper_fill', '钢板 mask'],
      ['paper_mask', 'A4 mask']
    ];

    function getClientId() {
      let id = localStorage.getItem(CLIENT_KEY);
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : `client_${Date.now()}_${Math.random().toString(16).slice(2)}`)
          .replace(/[^A-Za-z0-9_-]/g, '_');
        localStorage.setItem(CLIENT_KEY, id);
      }
      return id;
    }

    const clientId = getClientId();

    function apiHeaders() {
      return {
        'X-Auth-Token': AUTH_TOKEN,
        'X-Client-Id': clientId
      };
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function resolveUrl(url) {
      if (!url) return '';
      if (/^https?:\/\//i.test(url)) return url;
      if (url.startsWith('/')) return window.location.origin + url;
      return window.location.origin + '/' + url.replace(/^\/+/, '');
    }

    function setStatus(text, type = '') {
      statusBox.className = `status-box${type ? ' ' + type : ''}`;
      statusBox.textContent = text;
    }

    function formatSize(bytes) {
      const value = Number(bytes || 0);
      if (value >= 1024 * 1024) return `${(value / 1024 / 1024).toFixed(2)} MB`;
      if (value >= 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${value} B`;
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString();
    }

    function statusText(status) {
      return {
        queued: '等待中',
        processing: '处理中',
        completed: '已完成',
        failed: '失败'
      }[status] || status || '-';
    }

    function progressValue(task) {
      const base = Number(task.progress || 0);
      if (task.status !== 'processing') return Math.max(0, Math.min(100, base));
      const tick = Math.floor((Date.now() / 700) % 18);
      return Math.max(base, Math.min(92, base + tick));
    }

    function makeSelectedFileItems(files) {
      selectedFiles.forEach(item => {
        if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      });

      return Array.from(files || []).map((file, index) => ({
        id: `file_${Date.now()}_${index}_${Math.random().toString(16).slice(2)}`,
        file,
        previewUrl: URL.createObjectURL(file),
        usePlatePerspective: false,
        enableNotchRepair: false,
        notchWidth: 80,
        notchDepth: 25,
        targetSize1: '',
        targetSize2: '',
        targetX: '',
        targetY: ''
      }));
    }

    function renderSelectedFiles() {
      if (!selectedFiles.length) {
        selectedFilesBox.className = 'selected-files empty';
        selectedFilesBox.textContent = '尚未选择文件';
        return;
      }

      selectedFilesBox.className = 'selected-files';
      selectedFilesBox.innerHTML = selectedFiles.map(item => `
        <div class="selected-file" data-file-id="${escapeHtml(item.id)}">
          <img class="selected-thumb" src="${escapeHtml(item.previewUrl)}" alt="${escapeHtml(item.file.name)}">
          <div>
            <div class="selected-file-name" title="${escapeHtml(item.file.name)}">${escapeHtml(item.file.name)}</div>
            <div class="subtext">${escapeHtml(formatSize(item.file.size))}</div>
            <div class="selected-options">
              <label>
                <input type="checkbox" data-file-option="usePlatePerspective" ${item.usePlatePerspective ? 'checked' : ''}>
                <span>钢板透视</span>
              </label>
              <label>
                <input type="checkbox" data-file-option="enableNotchRepair" ${item.enableNotchRepair ? 'checked' : ''}>
                <span>小凹修复</span>
              </label>
              <div class="selected-size-values">
                <label class="selected-number-field">
                  <span>目标尺寸1(mm)</span>
                  <input type="number" min="1" step="1" value="${escapeHtml(item.targetSize1)}" placeholder="自动匹配" data-file-option="targetSize1">
                </label>
                <label class="selected-number-field">
                  <span>目标尺寸2(mm)</span>
                  <input type="number" min="1" step="1" value="${escapeHtml(item.targetSize2)}" placeholder="自动匹配" data-file-option="targetSize2">
                </label>
              </div>
              <div class="selected-size-values explicit-size-values">
                <label class="selected-number-field">
                  <span>指定 X(mm)</span>
                  <input type="number" min="1" step="1" value="${escapeHtml(item.targetX)}" placeholder="自动" data-file-option="targetX">
                </label>
                <label class="selected-number-field">
                  <span>指定 Y(mm)</span>
                  <input type="number" min="1" step="1" value="${escapeHtml(item.targetY)}" placeholder="自动" data-file-option="targetY">
                </label>
              </div>
              ${item.enableNotchRepair ? `
                <div class="selected-notch-values">
                  <input type="number" min="30" max="600" step="10" value="${escapeHtml(item.notchWidth)}" data-file-option="notchWidth" title="最大宽度 mm">
                  <input type="number" min="10" max="250" step="5" value="${escapeHtml(item.notchDepth)}" data-file-option="notchDepth" title="最大深度 mm">
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function optionalPositiveNumber(value, label) {
      const text = String(value ?? '').trim();
      if (!text) return null;
      const number = Number(text);
      if (!Number.isFinite(number) || number <= 0) {
        throw new Error(`${label}必须大于 0`);
      }
      return number;
    }

    function buildFormData() {
      if (!selectedFiles.length) {
        throw new Error('请先选择图片');
      }

      const fd = new FormData();
      selectedFiles.forEach(item => fd.append('images', item.file));
      fd.append('yolo_input_mode', 'canonical_path');
      fd.append('plate_class', 'plate');
      fd.append('paper_class', 'paper');
      // fd.append('paper_source', 'yolo');
      fd.append('paper_source', 'sam2');
      fd.append('paper_sam2_yolo_fallback', 'false');
      fd.append('a4_orientation', 'auto');
      fd.append('perspective_source', 'a4');
      fd.append('paper_rect_mode', 'approx_poly');
      fd.append('simplify_mm', '3.0');
      fd.append('topdown_mm_per_px', '2.0');
      fd.append('topdown_padding_mm', '50.0');
      fd.append('imgsz', '1280');
      fd.append('conf', '0.35');
      // fd.append('sam_model', 'sam2');
      fd.append('sam_model', 'sam2:small');
      fd.append('dxf_postprocess_enabled', 'true');
      fd.append('dxf_notch_fill_enabled', 'false');
      fd.append('per_file_options', JSON.stringify(selectedFiles.map(item => {
        const targetSize1 = optionalPositiveNumber(item.targetSize1, `${item.file.name} 目标尺寸1`);
        const targetSize2 = optionalPositiveNumber(item.targetSize2, `${item.file.name} 目标尺寸2`);
        if ((targetSize1 === null) !== (targetSize2 === null)) {
          throw new Error(`${item.file.name} 的目标尺寸1和目标尺寸2必须同时填写`);
        }

        return {
          filename: item.file.name,
          use_plate_perspective: Boolean(item.usePlatePerspective),
          dxf_notch_fill_enabled: Boolean(item.enableNotchRepair),
          dxf_notch_fill_max_width_mm: Number(item.notchWidth || 80),
          dxf_notch_fill_max_depth_mm: Number(item.notchDepth || 25),
          dxf_target_size_1_mm: targetSize1,
          dxf_target_size_2_mm: targetSize2,
          dxf_target_x_mm: optionalPositiveNumber(item.targetX, `${item.file.name} 目标X尺寸`),
          dxf_target_y_mm: optionalPositiveNumber(item.targetY, `${item.file.name} 目标Y尺寸`)
        };
      })));

      return fd;
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      const contentType = response.headers.get('content-type') || '';
      const data = contentType.includes('application/json')
        ? await response.json()
        : await response.text();

      if (!response.ok) {
        const message = typeof data === 'string' ? data : (data.detail || JSON.stringify(data));
        throw new Error(message);
      }

      return data;
    }

    function completedDxfTasks() {
      return tasks.filter(task => task.status === 'completed' && (
        (task.urls && task.urls.dxf) || (task.paths && task.paths.dxf)
      ));
    }

    function iconSvg(name) {
      const icons = {
        upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
        trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
        refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
        eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
        file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
      };
      return `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || ''}</svg>`;
    }

    function setButtonLabel(button, iconName, text) {
      button.innerHTML = `${iconSvg(iconName)}${escapeHtml(text)}`;
    }

    function decorateStaticButtons() {
      setButtonLabel(submitBtn, 'upload', '上传并识别');
      setButtonLabel(clearBtn, 'trash', '清除列表');
      setButtonLabel(refreshBtn, 'refresh', '刷新');
      setButtonLabel(downloadDxfBtn, 'download', '批量下载DXF');
    }

    function updateDownloadDxfButton() {
      const count = completedDxfTasks().length;
      downloadDxfBtn.disabled = isDownloadingDxf || count === 0;
      const label = isDownloadingDxf
        ? '打包中'
        : (count > 0 ? `下载DXF(${count})` : '批量下载DXF');
      setButtonLabel(downloadDxfBtn, 'download', label);
      downloadDxfBtn.title = count > 0 ? `下载当前列表中 ${count} 个已完成 DXF` : '暂无可下载的 DXF';
    }

    function filenameFromDisposition(header, fallback) {
      const value = header || '';
      const utf8Match = value.match(/filename\*=UTF-8''([^;]+)/i);
      if (utf8Match) {
        try {
          return decodeURIComponent(utf8Match[1]);
        } catch (error) {
          return fallback;
        }
      }

      const asciiMatch = value.match(/filename="?([^";]+)"?/i);
      return asciiMatch ? asciiMatch[1] : fallback;
    }

    async function batchDownloadDxf() {
      const readyTasks = completedDxfTasks();
      if (!readyTasks.length) {
        setStatus('当前没有可下载的 DXF。', 'error');
        updateDownloadDxfButton();
        return;
      }

      isDownloadingDxf = true;
      updateDownloadDxfButton();
      setStatus(`正在打包 ${readyTasks.length} 个 DXF...`);

      try {
        const response = await fetch('/tasks/download-dxf', { headers: apiHeaders() });
        if (!response.ok) {
          const contentType = response.headers.get('content-type') || '';
          const errorBody = contentType.includes('application/json')
            ? await response.json()
            : await response.text();
          const message = typeof errorBody === 'string' ? errorBody : (errorBody.detail || JSON.stringify(errorBody));
          throw new Error(message);
        }

        const blob = await response.blob();
        const filename = filenameFromDisposition(response.headers.get('content-disposition'), 'plate_dxf.zip');
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(downloadUrl);

        const downloadedCount = response.headers.get('X-DXF-File-Count') || readyTasks.length;
        setStatus(`已打包下载 ${downloadedCount} 个 DXF。`, 'ok');
      } catch (error) {
        setStatus(`批量下载失败：${error.message || error}`, 'error');
      } finally {
        isDownloadingDxf = false;
        updateDownloadDxfButton();
      }
    }

    async function loadTasks(silent = false) {
      try {
        const data = await fetchJson('/tasks', { headers: apiHeaders() });
        tasks = data.tasks || [];

        if (!selectedTaskId || !tasks.some(task => task.id === selectedTaskId)) {
          const firstCompleted = tasks.find(task => task.status === 'completed');
          selectedTaskId = firstCompleted ? firstCompleted.id : (tasks[0] ? tasks[0].id : null);
        }

        renderTasks();
        renderPreview();
        updatePolling();

        if (!silent) {
          setStatus(`已加载 ${tasks.length} 个任务。`, 'ok');
        }
      } catch (error) {
        setStatus(`加载任务失败：${error.message || error}`, 'error');
      }
    }

    function updatePolling() {
      const hasRunning = tasks.some(task => task.status === 'queued' || task.status === 'processing');
      if (hasRunning && !pollingTimer) {
        pollingTimer = setInterval(() => loadTasks(true), 2000);
      } else if (!hasRunning && pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }
    }

    function dimensionsText(dims) {
      if (!dims || Object.keys(dims).length === 0) return '-';
      const length = dims.length_mm ?? dims.max_length_mm;
      const width = dims.width_mm ?? dims.max_width_mm;
      const xSize = dims.axis_bbox_width_mm;
      const ySize = dims.axis_bbox_height_mm;
      const area = dims.area_m2;
      return `
        <div class="metric-line">长：${escapeHtml(valueWithUnit(length, 'mm'))}</div>
        <div class="metric-line">宽：${escapeHtml(valueWithUnit(width, 'mm'))}</div>
        <div class="metric-line">X/Y：${escapeHtml(valueWithUnit(xSize, 'mm'))} / ${escapeHtml(valueWithUnit(ySize, 'mm'))}</div>
        <div class="metric-line">面积：${escapeHtml(valueWithUnit(area, 'm²'))}</div>
      `;
    }

    function geometryText(task) {
      const counts = task.dxf_geometry && task.dxf_geometry.entity_type_counts;
      if (!counts || Object.keys(counts).length === 0) return '-';
      return Object.entries(counts)
        .map(([key, value]) => `${key}:${value}`)
        .join(' ');
    }

    function valueWithUnit(value, unit) {
      if (value === undefined || value === null || value === '') return '-';
      return `${value} ${unit}`;
    }

    function taskSettingText(task) {
      const params = task.params || {};
      const perspective = params.perspective_source === 'plate' ? '钢板透视' : 'A4透视';
      const notch = params.dxf_notch_fill_enabled ? '小凹修复' : '无修复';
      const size1 = params.dxf_target_size_1_mm;
      const size2 = params.dxf_target_size_2_mm;
      const targetX = params.dxf_target_x_mm;
      const targetY = params.dxf_target_y_mm;
      const targetText = (size1 && size2)
        ? ` · 目标尺寸 ${size1}/${size2}mm`
        : (targetX || targetY)
        ? ` · 目标X/Y ${targetX || '自动'}/${targetY || '自动'}mm`
        : '';
      return `${perspective} · ${notch}${targetText}`;
    }

    function renderTaskDxfThumb(task) {
      const previewUrl = task.urls && task.urls.dxf_preview ? resolveUrl(task.urls.dxf_preview) : '';
      if (!previewUrl) {
        return `<div class="thumb-empty">${task.status === 'completed' ? '无预览' : statusText(task.status)}</div>`;
      }

      return `
        <button class="dxf-thumb-button" type="button" data-action="preview" data-id="${escapeHtml(task.id)}" title="查看 DXF 图形">
          <img src="${escapeHtml(previewUrl)}" alt="DXF 图形" loading="lazy">
        </button>
      `;
    }

    function renderFileCell(task) {
      const uploadUrl = task.urls && task.urls.upload ? resolveUrl(task.urls.upload) : '';
      return `
        <div class="file-cell">
          ${uploadUrl
            ? `<img class="task-thumb" src="${escapeHtml(uploadUrl)}" alt="${escapeHtml(task.filename)}" loading="lazy">`
            : '<div class="task-thumb"></div>'}
          <div>
            <div class="file-name" title="${escapeHtml(task.filename)}">${escapeHtml(task.filename)}</div>
            <div class="subtext">${escapeHtml(formatSize(task.size_bytes))} · ${escapeHtml(formatDate(task.created_at))}</div>
            <div class="subtext">${escapeHtml(taskSettingText(task))}</div>
          </div>
        </div>
      `;
    }

    function renderTasks() {
      if (!tasks.length) {
        taskTableWrap.innerHTML = '<div class="empty-table">当前客户端暂无上传任务。</div>';
        updateDownloadDxfButton();
        return;
      }

      const rows = tasks.map(task => {
        const progress = progressValue(task);
        const dxfUrl = task.urls && task.urls.dxf ? resolveUrl(task.urls.dxf) : '';
        const isSelected = task.id === selectedTaskId;

        return `
          <tr class="${isSelected ? 'selected' : ''}">
            <td>${renderTaskDxfThumb(task)}</td>
            <td>
              ${renderFileCell(task)}
            </td>
            <td>
              <span class="pill ${escapeHtml(task.status)}">${escapeHtml(statusText(task.status))}</span>
              <div class="subtext">${escapeHtml(task.message || '')}</div>
            </td>
            <td>
              <div>${progress}%</div>
              <div class="progress">
                <div class="progress-fill ${task.status === 'processing' ? 'processing' : ''}" style="width:${progress}%"></div>
              </div>
            </td>
            <td>${dimensionsText(task.plate_dimensions)}</td>
            <td>
              <div>${escapeHtml(geometryText(task))}</div>
              <div class="subtext">${escapeHtml(task.dxf_geometry && task.dxf_geometry.entity_count ? `实体 ${task.dxf_geometry.entity_count}` : '')}</div>
            </td>
            <td>
              <button class="btn-small" type="button" data-action="preview" data-id="${escapeHtml(task.id)}">${iconSvg('eye')}预览</button>
              ${dxfUrl ? `<a class="btn-small" href="${escapeHtml(dxfUrl)}" download>${iconSvg('file')}DXF</a>` : ''}
            </td>
          </tr>
        `;
      }).join('');

      taskTableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>图形</th>
              <th>文件</th>
              <th>状态</th>
              <th>进度</th>
              <th>尺寸</th>
              <th>DXF</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      updateDownloadDxfButton();
    }

    function metric(name, value, suffix = '') {
      const shown = value === undefined || value === null || value === ''
        ? '-'
        : `${value}${suffix}`;
      return `
        <div class="metric">
          <div class="name">${escapeHtml(name)}</div>
          <div class="value">${escapeHtml(shown)}</div>
        </div>
      `;
    }

    function renderPreview() {
      const task = tasks.find(item => item.id === selectedTaskId);
      if (!task) {
        previewPanel.innerHTML = '<div class="preview-empty">完成识别后，这里显示最终 DXF 图形。</div>';
        return;
      }

      if (task.status === 'failed') {
        previewPanel.innerHTML = `
          <div class="preview-empty">
            <div>
              <strong>${escapeHtml(task.filename)}</strong><br>
              识别失败：${escapeHtml(task.message || '未知错误')}
            </div>
          </div>
        `;
        return;
      }

      if (task.status !== 'completed') {
        previewPanel.innerHTML = `
          <div class="preview-empty">
            <div>
              <strong>${escapeHtml(task.filename)}</strong><br>
              ${escapeHtml(statusText(task.status))}，当前进度 ${progressValue(task)}%
            </div>
          </div>
        `;
        return;
      }

      const dims = task.plate_dimensions || {};
      const urls = task.urls || {};
      const previewUrl = urls.dxf_preview ? resolveUrl(urls.dxf_preview) : '';
      const dxfUrl = urls.dxf ? resolveUrl(urls.dxf) : '';
      const jsonUrl = urls.result_json ? resolveUrl(urls.result_json) : '';
      const detailsOpen = detailOpenByTask[task.id] ? ' open' : '';

      previewPanel.innerHTML = `
        <div class="dxf-preview">
          ${previewUrl
            ? `<a href="${escapeHtml(previewUrl)}" target="_blank"><img src="${escapeHtml(previewUrl)}" alt="DXF 预览"></a>`
            : '<div class="preview-empty">没有生成 DXF 预览图，可直接下载 DXF。</div>'}
        </div>

        <div class="metric-grid">
          ${metric('最大长度', dims.length_mm, ' mm')}
          ${metric('最大宽度', dims.width_mm, ' mm')}
          ${metric('X尺寸', dims.axis_bbox_width_mm, ' mm')}
          ${metric('Y尺寸', dims.axis_bbox_height_mm, ' mm')}
          ${metric('面积', dims.area_m2, ' m²')}
          ${metric('周长', dims.perimeter_mm, ' mm')}
        </div>

        <div class="download-row">
          ${dxfUrl ? `<a class="link-btn" href="${escapeHtml(dxfUrl)}" download>下载 DXF</a>` : ''}
          ${jsonUrl ? `<a class="link-btn secondary" href="${escapeHtml(jsonUrl)}" download>结果 JSON</a>` : ''}
        </div>

        <details data-task-detail="${escapeHtml(task.id)}"${detailsOpen}>
          <summary>详情图片</summary>
          ${renderDetailImages(urls)}
        </details>
      `;
    }

    function renderDetailImages(urls) {
      const cards = detailImages
        .filter(([key]) => urls && urls[key])
        .map(([key, title]) => {
          const url = resolveUrl(urls[key]);
          return `
            <div class="debug-card">
              <h3>${escapeHtml(title)}</h3>
              <a href="${escapeHtml(url)}" target="_blank">
                <img src="${escapeHtml(url)}" alt="${escapeHtml(title)}" loading="lazy">
              </a>
            </div>
          `;
        }).join('');

      return cards ? `<div class="debug-grid">${cards}</div>` : '<div class="debug-grid"><div class="subtext">暂无详情图片。</div></div>';
    }

    uploadZone.addEventListener('click', () => imageInput.click());

    uploadZone.addEventListener('dragover', event => {
      event.preventDefault();
      uploadZone.classList.add('dragging');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragging');
    });

    uploadZone.addEventListener('drop', event => {
      event.preventDefault();
      uploadZone.classList.remove('dragging');
      selectedFiles = makeSelectedFileItems(Array.from(event.dataTransfer.files || []).filter(file => file.type.startsWith('image/')));
      renderSelectedFiles();
      setStatus(selectedFiles.length ? `已选择 ${selectedFiles.length} 张图片。` : '未检测到图片文件。');
    });

    imageInput.addEventListener('change', () => {
      selectedFiles = makeSelectedFileItems(imageInput.files || []);
      renderSelectedFiles();
      setStatus(selectedFiles.length ? `已选择 ${selectedFiles.length} 张图片。` : '等待选择图片。');
    });

    selectedFilesBox.addEventListener('change', event => {
      const target = event.target;
      const option = target && target.dataset ? target.dataset.fileOption : '';
      if (!option) return;

      const row = target.closest('[data-file-id]');
      const item = row ? selectedFiles.find(file => file.id === row.dataset.fileId) : null;
      if (!item) return;

      if (option === 'usePlatePerspective') {
        item.usePlatePerspective = target.checked;
      } else if (option === 'enableNotchRepair') {
        item.enableNotchRepair = target.checked;
      } else if (option === 'notchWidth') {
        item.notchWidth = Number(target.value || 80);
      } else if (option === 'notchDepth') {
        item.notchDepth = Number(target.value || 25);
      } else if (option === 'targetSize1') {
        item.targetSize1 = target.value;
      } else if (option === 'targetSize2') {
        item.targetSize2 = target.value;
      } else if (option === 'targetX') {
        item.targetX = target.value;
      } else if (option === 'targetY') {
        item.targetY = target.value;
      }

      if (option === 'enableNotchRepair') {
        renderSelectedFiles();
      }
    });

    selectedFilesBox.addEventListener('input', event => {
      const target = event.target;
      const option = target && target.dataset ? target.dataset.fileOption : '';
      if (
        option !== 'targetSize1'
        && option !== 'targetSize2'
        && option !== 'targetX'
        && option !== 'targetY'
        && option !== 'notchWidth'
        && option !== 'notchDepth'
      ) return;

      const row = target.closest('[data-file-id]');
      const item = row ? selectedFiles.find(file => file.id === row.dataset.fileId) : null;
      if (!item) return;

      if (option === 'targetSize1') item.targetSize1 = target.value;
      if (option === 'targetSize2') item.targetSize2 = target.value;
      if (option === 'targetX') item.targetX = target.value;
      if (option === 'targetY') item.targetY = target.value;
      if (option === 'notchWidth') item.notchWidth = Number(target.value || 80);
      if (option === 'notchDepth') item.notchDepth = Number(target.value || 25);
    });

    uploadForm.addEventListener('submit', async event => {
      event.preventDefault();
      submitBtn.disabled = true;
      setButtonLabel(submitBtn, 'upload', '上传中');
      setStatus('正在上传并创建任务...');

      try {
        const data = await fetchJson('/tasks/upload', {
          method: 'POST',
          headers: apiHeaders(),
          body: buildFormData()
        });

        selectedFiles.forEach(item => {
          if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        });
        selectedFiles = [];
        imageInput.value = '';
        renderSelectedFiles();
        setStatus(`已创建 ${data.tasks.length} 个识别任务。`, 'ok');
        await loadTasks(true);
      } catch (error) {
        setStatus(`上传失败：${error.message || error}`, 'error');
      } finally {
        submitBtn.disabled = false;
        setButtonLabel(submitBtn, 'upload', '上传并识别');
      }
    });

    refreshBtn.addEventListener('click', () => loadTasks(false));
    downloadDxfBtn.addEventListener('click', batchDownloadDxf);

    clearBtn.addEventListener('click', async () => {
      if (!confirm('确认清除当前客户端的全部上传记录和结果文件？')) {
        return;
      }

      clearBtn.disabled = true;
      try {
        const data = await fetchJson('/tasks', {
          method: 'DELETE',
          headers: apiHeaders()
        });
        tasks = [];
        selectedTaskId = null;
        renderTasks();
        renderPreview();
        setStatus(`已清除 ${data.deleted} 条任务。`, 'ok');
      } catch (error) {
        setStatus(`清除失败：${error.message || error}`, 'error');
      } finally {
        clearBtn.disabled = false;
      }
    });

    taskTableWrap.addEventListener('click', event => {
      const target = event.target.closest('[data-action="preview"]');
      if (!target) return;
      selectedTaskId = target.dataset.id;
      renderTasks();
      renderPreview();
    });

    previewPanel.addEventListener('toggle', event => {
      const target = event.target;
      if (!target.matches || !target.matches('details[data-task-detail]')) return;
      detailOpenByTask[target.dataset.taskDetail] = target.open;
    }, true);

    decorateStaticButtons();
    renderSelectedFiles();
    updateDownloadDxfButton();
    loadTasks(true);
  </script>
</body>
</html>
