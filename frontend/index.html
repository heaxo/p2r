<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>钢板余料识别</title>
  <style>
    :root {
      --primary: hsl(181 84% 32%);
      --primary-dark: hsl(181 84% 26%);
      --primary-soft: hsl(181 70% 94%);
      --bg: #f5f7f8;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d9e2e4;
      --danger: #c81e1e;
      --ok: #16803a;
      --shadow: 0 16px 40px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, hsl(181 84% 93%), transparent 34%),
        linear-gradient(180deg, #f8fbfb 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 46px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: .02em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .badge {
      padding: 9px 13px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-title {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
      font-weight: 800;
    }

    .card-body {
      padding: 20px;
    }

    .upload-zone {
      position: relative;
      border: 2px dashed hsl(181 38% 72%);
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, hsl(181 62% 97%));
      min-height: 250px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: .18s ease;
      overflow: hidden;
    }

    .upload-zone:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .image-picker {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    .image-picker img {
      max-width: 100%;
      max-height: 330px;
      display: block;
      border-radius: 14px;
    }

    .upload-placeholder strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .upload-placeholder span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .point-marker {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid #ff2d2d;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 45, 45, .18);
      box-shadow: 0 0 0 5px rgba(255, 45, 45, .16);
      pointer-events: none;
    }

    .point-marker::before,
    .point-marker::after {
      content: "";
      position: absolute;
      background: #ff2d2d;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .point-marker::before {
      width: 28px;
      height: 2px;
    }

    .point-marker::after {
      width: 2px;
      height: 28px;
    }

    input[type="file"] {
      display: none;
    }

    .point-tip {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      transition: .18s ease;
    }

    .btn-primary {
      margin-top: 16px;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 10px 24px hsl(181 84% 32% / .22);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-primary:disabled {
      opacity: .62;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      margin-top: 10px;
      background: #eef5f6;
      color: var(--primary-dark);
    }

    .btn-secondary:hover {
      background: #dff0f1;
    }

    .progress-wrap {
      margin-top: 16px;
      display: none;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .progress {
      height: 12px;
      border-radius: 999px;
      background: #e6eff0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), hsl(181 76% 43%));
      transition: width .16s linear;
    }

    .status {
      margin-top: 14px;
      border-radius: 14px;
      padding: 12px 14px;
      background: #f4f7f8;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .status.ok {
      background: #ebf8ef;
      color: var(--ok);
    }

    .status.error {
      background: #fff0f0;
      color: var(--danger);
    }

    .empty {
      min-height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      padding: 28px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      background: #fbfdfd;
    }

    .metric .name {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .metric .value {
      font-size: 20px;
      font-weight: 900;
      color: var(--text);
      word-break: break-all;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      color: #fff;
      background: var(--primary);
    }

    .link-btn.secondary {
      background: #425466;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(200px, 1fr));
      gap: 12px;
    }

    .image-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      background: #fff;
    }

    .image-card h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #344054;
    }

    .image-card img {
      width: 100%;
      height: 260px;
      object-fit: contain;
      border-radius: 12px;
      background: #f6f9fa;
      display: block;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }

      .image-grid {
        grid-template-columns: 1fr;
      }
    }

    .tune-panel {
  margin-top: 14px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #fbfdfd;
  padding: 14px;
}

.tune-title {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 10px;
  color: var(--text);
}

.tune-row {
  margin-bottom: 12px;
}

.tune-row label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.tune-row strong {
  color: var(--primary-dark);
}

.tune-row input[type="range"] {
  width: 100%;
  accent-color: var(--primary);
}

.notch-preview {
  width: 100%;
  height: 120px;
  border: 1px dashed hsl(181 38% 72%);
  border-radius: 14px;
  background: #fff;
  margin-top: 8px;
}
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div>
        <h1>钢板余料识别</h1>
        <p>上传现场图片，自动识别钢板轮廓并生成 DXF 文件。</p>
      </div>
      <div class="badge">DXF 自动生成</div>
    </section>

    <main class="layout">
      <section class="card">
        <div class="card-title">上传图片</div>
        <div class="card-body">
          <form id="uploadForm">
            <div class="upload-zone" id="uploadZone">
              <div class="upload-placeholder">
                <strong>点击选择图片</strong>
                <span>支持 jpg、jpeg、png、bmp、webp。请选择包含钢板和 A4 纸的图片。</span>
              </div>
            </div>

            <input id="imageInput" type="file" accept="image/*" required />

            <div class="point-tip" id="pointTip">
              选择图片后，可点击钢板内部任意位置作为辅助识别点。模型无法识别钢板时会使用该点。
            </div>

            <button class="btn btn-secondary" id="chooseImageBtn" type="button">
              选择图片
            </button>

            <button class="btn btn-secondary" id="clearPointBtn" type="button" style="display:none;">
              清除辅助点
            </button>

            <div class="tune-panel">
  <label class="checkbox-row" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
    <input id="enableNotchRepair" type="checkbox" />
    <span>启用夹钳凹陷修复</span>
  </label>

  <div id="notchTuneFields" style="display:none;margin-top:12px;">
    <div class="tune-title">夹钳凹陷修复参数</div>

    <canvas id="notchPreview" class="notch-preview" width="340" height="120"></canvas>

    <div class="tune-row">
      <label>
        <span>凹陷最大宽度</span>
        <strong><span id="notchWidthValue">130</span> mm</strong>
      </label>
      <input id="notchWidth" type="range" min="30" max="600" step="10" value="130" />
    </div>

    <div class="tune-row">
      <label>
        <span>凹陷最大深度</span>
        <strong><span id="notchDepthValue">60</span> mm</strong>
      </label>
      <input id="notchDepth" type="range" min="20" max="250" step="5" value="60" />
    </div>
  </div>
</div>
            <button class="btn btn-primary" id="submitBtn" type="submit">
              开始识别
            </button>
          </form>

          <div class="progress-wrap" id="progressWrap">
            <div class="progress-top">
              <span id="progressText">正在处理</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>

          <div class="status" id="statusBox">请选择图片后提交。</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">识别结果</div>
        <div class="card-body" id="resultPanel">
          <div class="empty">暂无结果。提交图片后这里会显示尺寸、预览图和 DXF 下载按钮。</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const AUTH_TOKEN = 'tk_c2VjcmV0LXJhbmRvbS10b2tlbi0xMjM0NTY3OA';
    const SEGMENT_MS = 10000;

    const form = document.getElementById('uploadForm');
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const chooseImageBtn = document.getElementById('chooseImageBtn');
    const clearPointBtn = document.getElementById('clearPointBtn');
    const pointTip = document.getElementById('pointTip');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');
    const resultPanel = document.getElementById('resultPanel');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressText = document.getElementById('progressText');

    let progressTimer = null;
    let progressStart = 0;
    let progressSegment = 1;
    let selectedImageUrl = '';
    let manualPointRatio = null;

    const imageKeys = [
      ['debug_overlay', '识别效果图'],
      ['debug_mm_preview', '尺寸预览图'],
      ['debug_dxf_postprocess_preview', 'DXF后处理预览'],
      ['topdown_image', '俯视图'],
      ['plate_final_with_paper_fill', '钢板 mask'],
      ['paper_mask', 'A4 mask']
    ];

    const notchPreview = document.getElementById('notchPreview');

    const notchWidth = document.getElementById('notchWidth');
    const notchDepth = document.getElementById('notchDepth');

    const notchWidthValue = document.getElementById('notchWidthValue');
    const notchDepthValue = document.getElementById('notchDepthValue');
    const enableNotchRepair = document.getElementById('enableNotchRepair');

    const notchTuneFields = document.getElementById('notchTuneFields');

    enableNotchRepair.addEventListener('change', () => {
      notchTuneFields.style.display = enableNotchRepair.checked ? 'block' : 'none';

      if (enableNotchRepair.checked) {
        drawNotchPreview();
      }
    });

    function drawNotchPreview() {
      const ctx = notchPreview.getContext('2d');
      const w = notchPreview.width;
      const h = notchPreview.height;

      const maxWidth = Number(notchWidth.value);
      const maxDepth = Number(notchDepth.value);

      notchWidthValue.textContent = maxWidth;
      notchDepthValue.textContent = maxDepth;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);

      const baseY = 42;
      const centerX = w / 2;

      const widthPx = Math.min(180, Math.max(40, maxWidth / 3));
      const depthPx = Math.min(70, Math.max(10, maxDepth / 2.5));

      const leftX = centerX - widthPx / 2;
      const rightX = centerX + widthPx / 2;

      ctx.strokeStyle = '#d0d7de';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(24, baseY);
      ctx.lineTo(w - 24, baseY);
      ctx.stroke();

      ctx.strokeStyle = 'hsl(181 84% 32%)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(24, baseY);
      ctx.lineTo(leftX, baseY);
      ctx.lineTo(leftX + widthPx * 0.25, baseY + depthPx);
      ctx.lineTo(rightX - widthPx * 0.25, baseY + depthPx);
      ctx.lineTo(rightX, baseY);
      ctx.lineTo(w - 24, baseY);
      ctx.stroke();

      ctx.strokeStyle = '#ff2d2d';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(leftX, baseY);
      ctx.lineTo(rightX, baseY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#667085';
      ctx.font = '12px Arial';
      ctx.fillText(`最大宽度 ${maxWidth}mm`, 12, h - 30);
      ctx.fillText(`最大深度 ${maxDepth}mm`, 12, h - 12);

      ctx.fillStyle = 'hsl(181 84% 26%)';
      ctx.fillText('红线表示修复后的直边', w - 150, h - 12);
    }

    [
      notchWidth,
      notchDepth,
    ].forEach(el => {
      el.addEventListener('input', drawNotchPreview);
    });

    drawNotchPreview();


    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setStatus(text, type) {
      statusBox.className = 'status' + (type ? ' ' + type : '');
      statusBox.textContent = text;
    }

    function resolveUrl(url) {
      if (!url) return '';
      if (/^https?:\/\//i.test(url)) return url;
      if (url.startsWith('/')) return window.location.origin + url;
      return window.location.origin + '/' + url.replace(/^\/+/, '');
    }

    function setProgress(value, text) {
      const percent = Math.max(0, Math.min(100, Math.round(value)));
      progressBar.style.width = percent + '%';
      progressPercent.textContent = percent + '%';
      if (text) progressText.textContent = text;
    }

    function startProgress() {
      clearInterval(progressTimer);
      progressWrap.style.display = 'block';
      progressStart = Date.now();
      progressSegment = 1;
      setProgress(0, '正在处理...');

      progressTimer = setInterval(() => {
        const elapsed = Date.now() - progressStart;
        const currentSegment = Math.floor(elapsed / SEGMENT_MS) + 1;

        if (currentSegment !== progressSegment) {
          progressSegment = currentSegment;
          progressText.textContent = '正在处理...';
        }

        const inSegment = elapsed % SEGMENT_MS;
        const percent = (inSegment / SEGMENT_MS) * 100;
        setProgress(percent);
      }, 120);
    }

    function finishProgress(success) {
      clearInterval(progressTimer);
      progressTimer = null;
      setProgress(100, success ? '处理完成' : '处理结束');
    }

    function renderUploadPreview() {
      if (!selectedImageUrl) {
        uploadZone.innerHTML = `
          <div class="upload-placeholder">
            <strong>点击选择图片</strong>
            <span>支持 jpg、jpeg、png、bmp、webp。请选择包含钢板和 A4 纸的图片。</span>
          </div>
        `;

        clearPointBtn.style.display = 'none';
        pointTip.textContent = '选择图片后，可点击钢板内部任意位置作为辅助识别点。YOLO无法识别钢板时会使用该点。';
        return;
      }

      const markerHtml = manualPointRatio
        ? `<div class="point-marker" style="left:${manualPointRatio.x * 100}%;top:${manualPointRatio.y * 100}%;"></div>`
        : '';

      uploadZone.innerHTML = `
        <div class="image-picker">
          <img id="previewImage" src="${selectedImageUrl}" alt="图片预览" />
          ${markerHtml}
        </div>
      `;

      clearPointBtn.style.display = manualPointRatio ? 'block' : 'none';

      if (manualPointRatio) {
        pointTip.textContent = `已选择辅助点：x=${manualPointRatio.x.toFixed(4)}, y=${manualPointRatio.y.toFixed(4)}。再次点击图片可重新选择。`;
      } else {
        pointTip.textContent = '可点击钢板内部任意位置作为辅助识别点。未点击时，接口仍按默认逻辑识别。';
      }
    }

    function buildFormData() {
      const file = imageInput.files[0];
      if (!file) {
        throw new Error('请先选择图片');
      }

      const fd = new FormData();

      fd.append('image', file);
      fd.append('yolo_input_mode', 'canonical_path');
      fd.append('plate_class', 'plate');
      fd.append('paper_class', 'paper');
      fd.append('paper_source', 'yolo');
      // fd.append('paper_source', 'sam2');
      fd.append('paper_sam2_yolo_fallback', 'false');
      fd.append('a4_orientation', 'auto');
      fd.append('paper_rect_mode', 'approx_poly');
      fd.append('simplify_mm', '3.0');
      fd.append('topdown_mm_per_px', '2.0');
      fd.append('topdown_padding_mm', '50.0');
      fd.append('imgsz', '1280');
      fd.append('conf', '0.35');
      fd.append('sam_model', 'sam2');

      if (manualPointRatio) {
        fd.append(
          'user_point_ratio',
          `${manualPointRatio.x.toFixed(6)},${manualPointRatio.y.toFixed(6)}`
        );
      }

      fd.append('dxf_postprocess_enabled', 'true');

      fd.append('dxf_postprocess_enabled', 'true');
      fd.append('dxf_notch_fill_enabled', enableNotchRepair.checked ? 'true' : 'false');

      if (enableNotchRepair.checked) {
        fd.append('dxf_notch_fill_max_width_mm', notchWidth.value);
        fd.append('dxf_notch_fill_max_depth_mm', notchDepth.value);
      }

      return fd;
    }

    function metric(name, value, suffix) {
      const shown = value === undefined || value === null || value === ''
        ? '-'
        : String(value) + (suffix || '');

      return `
        <div class="metric">
          <div class="name">${escapeHtml(name)}</div>
          <div class="value">${escapeHtml(shown)}</div>
        </div>
      `;
    }

    function renderImages(urls) {
      const cards = imageKeys
        .filter(([key]) => urls && urls[key])
        .map(([key, title]) => {
          const fullUrl = resolveUrl(urls[key]);
          return `
            <div class="image-card">
              <h3>${escapeHtml(title)}</h3>
              <a href="${escapeHtml(fullUrl)}" target="_blank">
                <img src="${escapeHtml(fullUrl)}" alt="${escapeHtml(title)}" loading="lazy" />
              </a>
            </div>
          `;
        })
        .join('');

      return cards ? `<div class="image-grid">${cards}</div>` : '';
    }

    function renderResult(data) {
      const dims = data.plate_dimensions || {};
      const urls = data.urls || {};
      const dxfUrl = urls.dxf ? resolveUrl(urls.dxf) : '';
      const jsonUrl = urls.result_json ? resolveUrl(urls.result_json) : '';

      resultPanel.innerHTML = `
        <div class="metrics">
          ${metric('长度', dims.length_mm, ' mm')}
          ${metric('宽度', dims.width_mm, ' mm')}
          ${metric('面积', dims.area_m2, ' m²')}
          ${metric('周长', dims.perimeter_mm, ' mm')}
        </div>

        <div class="actions">
          ${dxfUrl ? `<a class="link-btn" href="${escapeHtml(dxfUrl)}" download>下载 DXF</a>` : ''}
          ${jsonUrl ? `<a class="link-btn secondary" href="${escapeHtml(jsonUrl)}" download>下载结果 JSON</a>` : ''}
        </div>

        ${renderImages(urls)}
      `;
    }

    chooseImageBtn.addEventListener('click', () => {
      imageInput.click();
    });

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];

      if (!file) {
        selectedImageUrl = '';
        manualPointRatio = null;
        renderUploadPreview();
        setStatus('请选择图片后提交。');
        return;
      }

      if (selectedImageUrl) {
        URL.revokeObjectURL(selectedImageUrl);
      }

      selectedImageUrl = URL.createObjectURL(file);
      manualPointRatio = null;

      renderUploadPreview();
      setStatus('图片已选择。可直接识别，也可以点击钢板内部位置作为辅助点。');
    });

    uploadZone.addEventListener('click', (event) => {
      const file = imageInput.files[0];

      if (!file) {
        imageInput.click();
        return;
      }

      const img = document.getElementById('previewImage');
      if (!img) {
        return;
      }

      const rect = img.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;

      if (x < 0 || x > 1 || y < 0 || y > 1) {
        return;
      }

      manualPointRatio = {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y)),
      };

      renderUploadPreview();
      setStatus(`已选择钢板辅助点：${manualPointRatio.x.toFixed(4)},${manualPointRatio.y.toFixed(4)}。提交后会传给接口。`);
    });

    clearPointBtn.addEventListener('click', () => {
      manualPointRatio = null;
      renderUploadPreview();
      setStatus('已清除辅助点。');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = '识别中...';
      resultPanel.innerHTML = '<div class="empty">正在识别，请不要关闭页面。</div>';
      setStatus('正在上传并识别图片。');
      startProgress();

      try {
        const response = await fetch('/measure', {
          method: 'POST',
          headers: {
            'X-Auth-Token': AUTH_TOKEN,
          },
          body: buildFormData(),
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : await response.text();

        if (!response.ok) {
          const message = typeof data === 'string'
            ? data
            : (data.detail || JSON.stringify(data));
          throw new Error(message);
        }

        finishProgress(true);
        renderResult(data);
        setStatus('识别完成。', 'ok');
      } catch (error) {
        finishProgress(false);

        const message = error && error.message
          ? error.message
          : String(error);

        resultPanel.innerHTML = `<div class="empty">处理失败：${escapeHtml(message)}</div>`;
        setStatus('处理失败：' + message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '开始识别';
      }
    });
  </script>
</body>
</html>
